                                            <Icon name="edit" size={15} />
                                        </button>
                                        <button onClick={() => requestConfirm(`¿Eliminar "${title}"?`, () => setRadios(radios.filter(r => r.id !== radio.id)))} className="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition-colors" title="Eliminar">
                                            <Icon name="trash" size={15} />
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };
        // --- COMPONENTE EDITOR: COLECCIÓN MUSICAL (VIDEOTECA / ARCHIVE.ORG) ---
        const VideotecaEditor = ({ videoteca, setVideoteca, showToast, requestConfirm, onTestPlayer }) => {
            const [selectedItemId, setSelectedItemId] = useState(null);
            const [editingItem, setEditingItem] = useState(null); 
            const [editingPista, setEditingPista] = useState(null); 
            const [searchTerm, setSearchTerm] = useState('');
            const selectedItem = videoteca.find(v => v.id === selectedItemId);

            const GENRES = [
                'Rock',
                'Pop & Disco',
                'Baladas & Romántica',
                'Tropical & Salsa',
                'Reggae & Soul'
            ];

            const mapLegacyGenre = (g) => {
                if (!g) return 'Rock';
                if (GENRES.includes(g)) return g;
                const lower = g.toLowerCase();
                if (/pop|disco|dance|new wave/i.test(lower)) return 'Pop & Disco';
                if (/balada|rom[aá]ntic|bolero/i.test(lower)) return 'Baladas & Romántica';
                if (/tropical|salsa|cumbia|merengue|cha-cha|latino/i.test(lower)) return 'Tropical & Salsa';
                if (/reggae|soul|funk|r&b|ska/i.test(lower)) return 'Reggae & Soul';
                if (/rock|metal/i.test(lower)) return 'Rock';
                return g;
            };

            const exportData = () => {
                const exportArray = videoteca.map(({ id, pistas, tracks, ...v }) => {
                    const rawTracks = pistas || tracks || [];
                    return {
                        artist: v.artist || v.artista || 'Artista Clásico',
                        album: v.album || v.titulo || v.title || 'Álbum',
                        year: String(v.year || v.año || '1980'),
                        genre: v.genre || v.genero || 'Rock',
                        cover: v.cover || v.imagen || v.image || '',
                        musicUrl: v.musicUrl || v.urlDrive || v.url || '',
                        description: v.description || v.descripcion || '',
                        tracks: rawTracks.map(({ id, ...p }) => {
                            const audioUrl = p.audio || p.urlDrive || p.url || '';
                            const extractedArchiveId = p.archiveId || getArchiveIdFromUrl(audioUrl);
                            return {
                                title: p.title || p.titulo || 'Pista',
                                audio: audioUrl,
                                duration: p.duration || p.duracion || 'Álbum',
                                type: (p.type === 'archive' || extractedArchiveId) ? 'archive' : 'audio',
                                archiveId: extractedArchiveId || undefined
                            };
                        })
                    };
                });
                downloadFile(JSON.stringify(exportArray, null, 2), 'videoteca.json', 'application/json');
                showToast('Archivo videoteca.json de BoxPlayMusic generado correctamente');
            };

            const saveItemBase = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const album = (formData.get('album') || '').trim();
                const artist = (formData.get('artist') || '').trim();
                const rawMusicUrl = (formData.get('musicUrl') || '').trim();
                const archiveId = getArchiveIdFromUrl(rawMusicUrl);

                const existingIndex = videoteca.findIndex(v => 
                    (v.album || v.titulo || v.title || '').toLowerCase() === album.toLowerCase() &&
                    (v.artist || v.artista || '').toLowerCase() === artist.toLowerCase() &&
                    (!editingItem || v.id !== editingItem.id)
                );

                if (existingIndex !== -1) {
                    showToast(`El álbum "${album}" de ${artist} ya existe.`, 'error');
                    return;
                }

                const newData = {
                    artist,
                    artista: artist,
                    album,
                    titulo: album,
                    title: album,
                    year: formData.get('year') || '1980',
                    genre: formData.get('genre') || 'Rock',
                    cover: formData.get('cover') || '',
                    musicUrl: rawMusicUrl,
                    urlDrive: rawMusicUrl,
                    archiveId: archiveId || undefined,
                    description: formData.get('description') || ''
                };
                
                if (editingItem.isNew) {
                    const newItem = { ...newData, id: `alb-${Date.now()}`, tracks: [] };
                    setVideoteca([newItem, ...videoteca]);
                    setSelectedItemId(newItem.id);
                    showToast('Álbum Clásico creado');
                } else {
                    setVideoteca(videoteca.map(v => v.id === editingItem.id ? { ...v, ...newData } : v));
                    showToast('Álbum Clásico actualizado');
                }
                setEditingItem(null);
            };

            const savePista = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const title = (formData.get('title') || '').trim();
                const audio = (formData.get('audio') || '').trim();
                const customArchiveId = (formData.get('archiveId') || '').trim();
                const extractedArchiveId = customArchiveId || getArchiveIdFromUrl(audio);
                const currentTracks = selectedItem.tracks || selectedItem.pistas || [];
                const updatedTracks = [...currentTracks];

                const existingPistaIndex = updatedTracks.findIndex(p => 
                    (p.title || p.titulo || '').toLowerCase() === title.toLowerCase() && 
                    (editingPista.isNew || updatedTracks[editingPista.index]?.title !== title)
                );
                
                if (existingPistaIndex !== -1) {
                    showToast(`La pista "${title}" ya existe en este álbum.`, 'error');
                    return;
                }

                const pistaData = { 
                    title, 
                    audio, 
                    url: audio,
                    urlDrive: audio,
                    duration: formData.get('duration') || 'Álbum', 
                    type: (extractedArchiveId || audio.includes('archive.org')) ? 'archive' : 'audio',
                    archiveId: extractedArchiveId || undefined,
                    id: `pista-${Date.now()}` 
                };
                
                if (editingPista.isNew) {
                    updatedTracks.push(pistaData);
                    showToast('Canción añadida al álbum');
                } else {
                    pistaData.id = updatedTracks[editingPista.index].id; 
                    updatedTracks[editingPista.index] = pistaData;
                    showToast('Canción actualizada');
                }
                
                setVideoteca(videoteca.map(v => v.id === selectedItem.id ? { ...selectedItem, tracks: updatedTracks, pistas: updatedTracks } : v));
                setEditingPista(null);
            };

            const deletePista = (idx) => {
                requestConfirm('¿Eliminar esta canción del álbum?', () => {
                    const currentTracks = selectedItem.tracks || selectedItem.pistas || [];
                    const updatedTracks = currentTracks.filter((_, i) => i !== idx);
                    setVideoteca(videoteca.map(v => v.id === selectedItem.id ? { ...selectedItem, tracks: updatedTracks, pistas: updatedTracks } : v));
                    showToast('Canción eliminada');
                });
            };

            const moveItem = (index, direction) => {
                const newItems = [...videoteca];
                if (direction === 'up' && index > 0) {
                    [newItems[index - 1], newItems[index]] = [newItems[index], newItems[index - 1]];
                } else if (direction === 'down' && index < newItems.length - 1) {
                    [newItems[index + 1], newItems[index]] = [newItems[index], newItems[index + 1]];
                }
                setVideoteca(newItems);
            };

            const filteredVideoteca = videoteca.filter(v => {
                const name = (v.album || v.titulo || v.title || '').toLowerCase();
                const art = (v.artist || v.artista || '').toLowerCase();
                const gen = (v.genre || v.genero || '').toLowerCase();
                const yr = String(v.year || v.año || '');
                const q = searchTerm.toLowerCase();
                return name.includes(q) || art.includes(q) || gen.includes(q) || yr.includes(q);
            });

            return (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 flex flex-col md:flex-row min-h-[72vh] overflow-hidden">
                    {/* Lista Lateral de Discos */}
                    <div className="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-slate-200 bg-slate-50 flex flex-col h-[50vh] md:h-auto md:max-h-[82vh]">
                        <div className="p-4 border-b border-slate-200 bg-white flex justify-between items-center">
                            <div>
                                <h2 className="text-base font-black text-slate-900 flex items-center gap-2">
                                    <Icon name="disc" className="text-amber-600" size={16}/> BoxPlayMusic
                                </h2>
                                <span className="text-[10px] text-slate-500 font-bold">({videoteca.length} álbumes clásicos)</span>
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={() => setEditingItem({ isNew: true })} className="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1">
                                    <Icon name="plus" size={12} /> Nuevo
                                </button>
                                <button onClick={exportData} className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1">
                                    <Icon name="download" size={12} /> Exportar
                                </button>
                            </div>
                        </div>

                        <div className="p-3 bg-white border-b border-slate-200">
                            <input 
                                type="text" 
                                placeholder="Buscar por álbum, artista o año..." 
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-amber-500 outline-none text-xs"
                            />
                        </div>

                        <div className="overflow-y-auto custom-scrollbar flex-1 p-2 space-y-1.5">
                            {filteredVideoteca.length === 0 ? (
                                <p className="text-xs text-slate-400 text-center py-6">No hay álbumes en BoxPlayMusic</p>
                            ) : (
                                filteredVideoteca.map((item, index) => {
                                    const albumTitle = item.album || item.titulo || item.title || 'Álbum';
                                    const artistName = item.artist || item.artista || 'Artista';
                                    const coverImg = item.cover || item.imagen || item.image;
                                    const tracksCount = (item.tracks || item.pistas || []).length;
                                    const isSelected = selectedItemId === item.id;

                                    return (
                                        <div 
                                            key={item.id || index} 
                                            onClick={() => setSelectedItemId(item.id)} 
                                            className={`p-2.5 rounded-2xl cursor-pointer flex items-center justify-between gap-3 transition-all ${isSelected ? 'bg-amber-100/80 border-l-4 border-amber-600 shadow-sm' : 'hover:bg-slate-200/60'}`}
                                        >
                                            <div className="flex items-center gap-3 min-w-0">
                                                <div className="w-11 h-11 rounded-lg bg-black border border-slate-200 overflow-hidden shrink-0 shadow-sm">
                                                    <img 
                                                        src={coverImg} 
                                                        className="w-full h-full object-cover" 
                                                        onError={(e) => { e.target.src='https://placehold.co/80x80/111/d4af37?text=DISCO'; }}
                                                    />
                                                </div>
                                                <div className="min-w-0">
                                                    <h4 className="font-extrabold text-xs truncate text-slate-900">{albumTitle}</h4>
                                                    <p className="text-[11px] text-amber-800 font-bold truncate">{artistName}</p>
                                                    <p className="text-[10px] text-slate-400 truncate mt-0.5">
                                                        {item.year || '1980'} · {item.genre || 'Rock'} · {tracksCount} pistas
                                                    </p>
                                                </div>
                                            </div>
                                            <div className="flex gap-0.5 shrink-0" onClick={e => e.stopPropagation()}>
                                                <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-1 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="up" size={12}/></button>
                                                <button onClick={() => moveItem(index, 'down')} disabled={index === videoteca.length - 1} className="p-1 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="down" size={12}/></button>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    {/* Detalle del Álbum y Canciones */}
                    <div className="w-full md:w-2/3 p-4 md:p-6 overflow-y-auto max-h-[70vh] md:max-h-[82vh] custom-scrollbar bg-white">
                        {!selectedItem ? (
                            <div className="h-full flex flex-col items-center justify-center text-slate-400 py-16">
                                <Icon name="disc" size={56} className="mb-3 opacity-20 text-amber-600"/>
                                <p className="text-sm font-bold text-slate-600">Ningún álbum seleccionado</p>
                                <p className="text-xs text-slate-400 mt-1">Elige un álbum clásico a la izquierda o crea uno nuevo con sus enlaces de Archive.org o audio.</p>
                            </div>
                        ) : (
                            <div className="animate-fade-in space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between items-start gap-4 border-b border-slate-100 pb-5">
                                    <div className="flex gap-4 items-start">
                                        <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden bg-black border-2 border-amber-500/50 shadow-md shrink-0">
                                            <img 
                                                src={selectedItem.cover || selectedItem.imagen} 
                                                className="w-full h-full object-cover" 
                                                onError={(e) => { e.target.src='https://placehold.co/150x150/111/d4af37?text=DISCO'; }}
                                            />
                                        </div>
                                        <div className="min-w-0">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <span className="bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                                                    {selectedItem.genre || 'Rock'}
                                                </span>
                                                <span className="bg-slate-100 text-slate-700 text-[10px] font-mono font-bold px-2 py-0.5 rounded-full">
                                                    Año: {selectedItem.year || '1980'}
                                                </span>
                                                {selectedItem.archiveId && (
                                                    <span className="bg-amber-500/10 text-amber-800 border border-amber-500/30 text-[9px] font-mono font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                                                        <Icon name="archive" size={10} /> ID: {selectedItem.archiveId}
                                                    </span>
                                                )}
                                            </div>
                                            <h1 className="text-xl sm:text-2xl font-black text-slate-900 mt-1.5 truncate">{selectedItem.album || selectedItem.titulo}</h1>
                                            <h2 className="text-sm font-bold text-amber-800 truncate">{selectedItem.artist || selectedItem.artista}</h2>
                                            
                                            {/* Indicador de URL */}
                                            <div className="mt-2.5 bg-amber-50/80 border border-amber-200 rounded-xl p-2.5 text-xs flex items-center justify-between gap-2 max-w-md">
                                                <div className="truncate">

        // --- COMPONENTE PRINCIPAL: APP ---
        const App = () => {

            const fileInputRef = useRef(null);

            const showToast = useCallback((msg, type = 'success') => {
                setToast({ msg, type, id: Date.now() });

            const requestConfirm = useCallback((message, onConfirm) => {
                setConfirmDialog({ isOpen: true, message, onConfirm });

            const openTestPlayer = useCallback((title, url) => {

                    showToast('Este elemento no tiene una URL válida para probar', 'error');

                setPlayerData({ isOpen: true, title, url });
            }, [showToast]);

            const recordStateChange = useCallback((newMovies, newEstrenos, newTudum, newSeries, newChannels, newAnimados, newRadios, newVideoteca) => {
                const currentState = { 
                    movies: newMovies, 
                    estrenos: newEstrenos, 
                    tudum: newTudum, 
                    series: newSeries, 
                    channels: newChannels, 
                    animados: newAnimados, 
                    radios: newRadios, 
                    videoteca: newVideoteca 
                };
                setHistory(prevHistory => {
                    const newHistory = prevHistory.slice(0, historyIndex + 1);
                    newHistory.push(currentState);
                    if (newHistory.length > 25) newHistory.shift();
                    return newHistory;
                });
                setHistoryIndex(prevIdx => Math.min(prevIdx + 1, 24));
            }, [historyIndex]);

            const handleUndo = () => {
                if (historyIndex > 0) {
                    const prev = history[historyIndex - 1];
                    setHistoryIndex(historyIndex - 1);
                    setMovies(prev.movies);
                    setEstrenos(prev.estrenos);
                    setTudumList(prev.tudum);
                    setSeries(prev.series);
                    setChannels(prev.channels);
                    setAnimados(prev.animados);
                    setRadios(prev.radios);
                    setVideoteca(prev.videoteca);
                    showToast('Cambio deshecho con éxito');
                } else {
                    showToast('No hay más acciones previas para deshacer', 'error');
                }
            };

            const downloadAllBackups = () => {
                const fullBackup = {
                    date: new Date().toISOString(),
                    app: 'Box Play TV',
                    movies: movies.map(({ id, ...r }) => r),
                    estrenos2026: estrenos.map(({ id, ...r }) => r),
                    tudum: tudumList.map(({ id, ...r }) => r),
                    series: series.map(({ id, ...s }) => ({
                        tituloSerie: s.tituloSerie,
                        descripcion: s.descripcion,
                        imagen: s.imagen,
                        codigo: s.codigo,
                        qualityTag: s.qualityTag,
                        temporadas: (s.temporadas || []).map(t => ({
                            numeroTemporada: t.numeroTemporada,
                            episodios: (t.episodios || []).map(({ id, ...ep }) => ep)
                        }))
                    })),
                    animados: animados.map(({ id, ...r }) => r),
                    radios: radios.map(({ id, ...r }) => r),
                    videoteca: videoteca.map(({ id, pistas, tracks, ...v }) => ({
                        artist: v.artist,
                        album: v.album,
                        year: v.year,
                        genre: v.genre,
                        cover: v.cover,
                        musicUrl: v.musicUrl,
                        description: v.description,
                        tracks: (pistas || tracks || []).map(({ id, ...p }) => p)
                    })),
                    tvM3U: generateM3U(channels)
                };

                const dateStr = new Date().toISOString().slice(0, 10);
                downloadFile(JSON.stringify(fullBackup, null, 2), `boxplaytv_backup_completo_${dateStr}.json`, 'application/json');
                showToast('Copia de seguridad completa descargada');
            };

            const fetchFromCloud = async () => {
                setLoading(true);
                try {
                    const [resTV, resSeries, resMovies, resEstrenos, resTudum, resAnimados, resRadios, resVideoteca] = await Promise.all([
                        fetchSmart(SOURCE_URLS.TV, RAW_URLS.TV, false),
                        fetchSmart(SOURCE_URLS.SERIES, RAW_URLS.SERIES, true),
                        fetchSmart(SOURCE_URLS.MOVIES, RAW_URLS.MOVIES, true),
                        fetchSmart(SOURCE_URLS.ESTRENOS2026, RAW_URLS.ESTRENOS2026, true),
                        fetchSmart(SOURCE_URLS.TUDUM, RAW_URLS.TUDUM, true),
                        fetchSmart(SOURCE_URLS.ANIMADOS, RAW_URLS.ANIMADOS, true),
                        fetchSmart(SOURCE_URLS.RADIOS, RAW_URLS.RADIOS, true),
                        fetchSmart(SOURCE_URLS.VIDEOTECA, RAW_URLS.VIDEOTECA, true)
                    ]);

                    const parsedChannels = parseM3U(resTV || '');
                    
                    const parsedSeries = (Array.isArray(resSeries) ? resSeries : (resSeries?.series || [])).map((s, i) => ({
                        ...s, 
                        id: `serie-${i}`,
                        temporadas: (s.temporadas || []).map(t => ({
                            ...t, 
                            episodios: (t.episodios || []).map((ep, ei) => ({ ...ep, id: `ep-${i}-${ei}` }))
                        }))
                    }));

                    const parsedMovies = (Array.isArray(resMovies) ? resMovies : (resMovies?.peliculas || [])).map((m, i) => ({ ...m, id: `mov-${i}` }));
                    const parsedEstrenos = (Array.isArray(resEstrenos) ? resEstrenos : (resEstrenos?.peliculas2 || resEstrenos?.peliculas || [])).map((m, i) => ({ ...m, id: `est-${i}` }));
                    const parsedTudum = (Array.isArray(resTudum) ? resTudum : (resTudum?.tudum || [])).map((t, i) => ({ ...t, id: `tudum-${i}` }));
                    
                    const parsedAnimados = (Array.isArray(resAnimados) ? resAnimados : (resAnimados?.animados || resAnimados?.animated || [])).map((a, i) => ({
                        ...a, 
                        id: `anim-${i}`,
                        temporadas: (a.temporadas || []).map(t => ({
                            ...t, 
                            episodios: (t.episodios || []).map((ep, ei) => ({ ...ep, id: `ep-anim-${i}-${ei}` }))
                        }))
                    }));

                    const parsedRadios = (Array.isArray(resRadios) ? resRadios : (resRadios?.radios || [])).map((r, i) => ({ ...r, id: r.id || `cr-${i}` }));
                    
                    const parsedVideoteca = (Array.isArray(resVideoteca) ? resVideoteca : (resVideoteca?.videoteca || resVideoteca?.albumes || [])).map((v, i) => ({
                        ...v, 
                        id: `vid-${i}`,
                        tracks: (v.tracks || v.pistas || []).map((p, pi) => ({ ...p, id: `pista-${i}-${pi}` }))
                    }));

                    setChannels(parsedChannels);
                    setSeries(parsedSeries);
                    setMovies(parsedMovies);
                    setEstrenos(parsedEstrenos);
                    setTudumList(parsedTudum);
                    setAnimados(parsedAnimados);
                    setRadios(parsedRadios);
                    setVideoteca(parsedVideoteca);

                    recordStateChange(parsedMovies, parsedEstrenos, parsedTudum, parsedSeries, parsedChannels, parsedAnimados, parsedRadios, parsedVideoteca);
                    showToast("Datos descargados y actualizados correctamente");
                } catch (error) {
                    console.error("Error sincronizando:", error);
                    showToast("Error al conectar con las fuentes remotas", "error");
                } finally {
                    setLoading(false);
                    setDataInitialized(true);
                }
            };

            const syncToGithub = async (token, repo, branch = 'main', setStep) => {
                const datasets = {
                    'peliculas.json': movies.map(({ id, ...rest }) => ({
                        titulo: rest.titulo || rest.title,
                        descripcion: rest.descripcion || rest.sinopsis,
                        imagen: rest.imagen || rest.image,
                        urlDrive: rest.urlDrive || '',
                        urlOkRu: rest.urlOkRu || '',
                        codigo: rest.codigo || null,
                        qualityTag: rest.qualityTag || ''
                    })),
                    'peliculas2.json': estrenos.map(({ id, ...rest }) => ({
                        titulo: rest.titulo || rest.title,
                        descripcion: rest.descripcion || rest.sinopsis,
                        imagen: rest.imagen || rest.image,
                        urlDrive: rest.urlDrive || '',
                        urlOkRu: rest.urlOkRu || '',
                        codigo: rest.codigo || null,
                        qualityTag: rest.qualityTag || ''
                    })),
                    'tudum.json': tudumList.map(({ id, ...rest }) => ({
                        title: rest.title || rest.titulo,
                        releaseDate: rest.releaseDate || rest.fechaEstreno,
                        genre: rest.genre || rest.genero,
                        synopsis: rest.synopsis || rest.sinopsis,
                        image: rest.image || rest.imagen,
                        trailerUrl: rest.trailerUrl || rest.urlTrailer,
                        availability: rest.availability || rest.disponibilidad,
                        score: rest.score || rest.puntuacion
                    })),
                    'playlist.json': series.map(({ id, ...s }) => ({
                        tituloSerie: s.tituloSerie,
                        descripcion: s.descripcion,
                        imagen: s.imagen,
                        codigo: s.codigo || null,
                        qualityTag: s.qualityTag || '',
                        temporadas: (s.temporadas || []).map(t => ({
                            numeroTemporada: t.numeroTemporada,
                            episodios: (t.episodios || []).map(({ id, ...ep }) => ({
                                tituloEpisodio: ep.tituloEpisodio,
                                urlDrive: ep.urlDrive
                            }))
                        }))
                    })),
                    'animados.json': animados.map(({ id, ...s }) => {
                        const out = {
                            titulo: s.titulo || s.tituloSerie,
                            descripcion: s.descripcion || '',
                            imagen: s.imagen || '',
                            codigo: s.codigo || null,
                            qualityTag: s.qualityTag || ''
                        };
                        if (s.urlDrive) out.urlDrive = s.urlDrive;
                        if (s.temporadas && s.temporadas.length > 0) {
                            out.temporadas = s.temporadas.map(t => ({
                                numeroTemporada: t.numeroTemporada,
                                episodios: (t.episodios || []).map(({ id, ...ep }) => ({
                                    tituloEpisodio: ep.tituloEpisodio,
                                    urlDrive: ep.urlDrive
                                }))
                            }));
                        }
                        return out;
                    }),
                    'radios.json': radios.map(({ id, ...rest }) => ({
                        title: rest.title || rest.titulo,
                        group: rest.group || rest.categoria || 'Nacionales',
                        genre: rest.genre || rest.genero || 'Radio HD',
                        logo: rest.logo || rest.imagen || '',
                        url: rest.url || rest.stream || ''
                    })),
                    'videoteca.json': videoteca.map(({ id, pistas, tracks, ...v }) => {
                        const rawTracks = pistas || tracks || [];
                        return {
                            artist: v.artist || v.artista || 'Artista Clásico',
                            album: v.album || v.titulo || v.title || 'Álbum',
                            year: String(v.year || v.año || '1980'),
                            genre: v.genre || v.genero || 'Rock',
                            cover: v.cover || v.imagen || v.image || '',
                            musicUrl: v.musicUrl || v.urlDrive || v.url || '',
                            description: v.description || v.descripcion || '',
                            tracks: rawTracks.map(({ id, ...p }) => {
                                const audioUrl = p.audio || p.urlDrive || p.url || '';
                                const extractedArchiveId = p.archiveId || getArchiveIdFromUrl(audioUrl);
                                return {
                                    title: p.title || p.titulo || 'Pista',
                                    audio: audioUrl,
                                    duration: p.duration || p.duracion || 'Álbum',
                                    type: (p.type === 'archive' || extractedArchiveId) ? 'archive' : 'audio',
                                    archiveId: extractedArchiveId || undefined
                                };
                            })
                        };
                    }),
                    'listaoficial.m3u': generateM3U(channels)
                };

                try {
                    let count = 0;
                    const total = Object.keys(datasets).length;

                    for (const [filename, content] of Object.entries(datasets)) {
                        count++;
                        if (setStep) setStep(`[${count}/${total}] Actualizando ${filename}...`);

                        const fileContentStr = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
                        const base64Content = btoa(unescape(encodeURIComponent(fileContentStr)));

                        const getUrl = `https://api.github.com/repos/${repo}/contents/${filename}?ref=${encodeURIComponent(branch)}`;
                        const getRes = await fetch(getUrl, {
                            headers: { 
                                'Authorization': `token ${token}`, 
                                'Accept': 'application/vnd.github.v3+json' 
                            }
                        });

                        let sha = null;
                        if (getRes.ok) {
                            const fileData = await getRes.json();
                            sha = fileData.sha;
                        }

                        const putUrl = `https://api.github.com/repos/${repo}/contents/${filename}`;
                        const putBody = {
                            message: `Actualizar ${filename} vía Box Play TV Panel Pro`,
                            content: base64Content,
                            branch: branch
                        };
                        if (sha) putBody.sha = sha;

                        const putRes = await fetch(putUrl, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(putBody)
                        });

                        if (!putRes.ok) {
                            const errData = await putRes.json().catch(() => ({}));
                            throw new Error(`Error actualizando ${filename}: ${errData.message || putRes.statusText}`);
                        }
                    }

                    showToast('¡Los 8 archivos de Box Play TV se actualizaron en GitHub exitosamente!');
                } catch (err) {
                    console.error(err);
                    showToast(`Error al sincronizar con GitHub: ${err.message}`, 'error');
                }
            };

            const handleFileImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const content = event.target.result;
                    try {
                        const filename = file.name.toLowerCase();
                        if (filename.endsWith('.m3u') || filename.endsWith('.m3u8')) {
                            const parsed = parseM3U(content);
                            setChannels(parsed);
                            recordStateChange(movies, estrenos, tudumList, series, parsed, animados, radios, videoteca);
                            showToast(`Importados ${parsed.length} canales de TV desde M3U`);
                        } else if (filename.includes('backup_completo')) {
                            const parsed = JSON.parse(content);
                            if (parsed.movies) setMovies(parsed.movies.map((m, i) => ({ ...m, id: `mov-${i}` })));
                            if (parsed.estrenos2026) setEstrenos(parsed.estrenos2026.map((m, i) => ({ ...m, id: `est-${i}` })));
                            if (parsed.tudum) setTudumList(parsed.tudum.map((t, i) => ({ ...t, id: `tudum-${i}` })));
                            if (parsed.series) setSeries(parsed.series.map((s, i) => ({ ...s, id: `serie-${i}` })));
                            if (parsed.animados) setAnimados(parsed.animados.map((a, i) => ({ ...a, id: `anim-${i}` })));
                            if (parsed.radios) setRadios(parsed.radios.map((r, i) => ({ ...r, id: `cr-${i}` })));
                            if (parsed.videoteca) setVideoteca(parsed.videoteca.map((v, i) => ({ ...v, id: `vid-${i}` })));
                            if (parsed.tvM3U) setChannels(parseM3U(parsed.tvM3U));
                            showToast('¡Copia de seguridad completa restaurada!');
                        } else if (filename.includes('peliculas2')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.peliculas2 || parsed.peliculas || [])).map((m, i) => ({ ...m, id: `est-${Date.now()}-${i}` }));
                            setEstrenos(list);
                            recordStateChange(movies, list, tudumList, series, channels, animados, radios, videoteca);
                            showToast(`Importados ${list.length} Estrenos 2026`);
                        } else if (filename.includes('tudum')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.tudum || [])).map((t, i) => ({ ...t, id: `tudum-${Date.now()}-${i}` }));
                            setTudumList(list);
                            recordStateChange(movies, estrenos, list, series, channels, animados, radios, videoteca);
                            showToast(`Importados ${list.length} estrenos de Netflix Tudum`);
                        } else if (filename.includes('peliculas') || filename.includes('movies')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.peliculas || [])).map((m, i) => ({ ...m, id: `mov-${Date.now()}-${i}` }));
                            setMovies(list);
                            recordStateChange(list, estrenos, tudumList, series, channels, animados, radios, videoteca);
                            showToast(`Importadas ${list.length} películas`);
                        } else if (filename.includes('radios') || filename.includes('radio')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.radios || [])).map((r, i) => ({ ...r, id: r.id || `cr-${Date.now()}-${i}` }));
                            setRadios(list);
                            recordStateChange(movies, estrenos, tudumList, series, channels, animados, list, videoteca);
                            showToast(`Importadas ${list.length} emisoras de radio`);
                        } else if (filename.includes('playlist') || filename.includes('series')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.series || [])).map((s, i) => ({ ...s, id: `serie-${Date.now()}-${i}` }));
                            setSeries(list);
                            recordStateChange(movies, estrenos, tudumList, list, channels, animados, radios, videoteca);
                            showToast(`Importadas ${list.length} series de TV`);
                        } else if (filename.includes('animados') || filename.includes('animated')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.animados || parsed.animated || [])).map((a, i) => ({ ...a, id: `anim-${Date.now()}-${i}` }));
                            setAnimados(list);
                            recordStateChange(movies, estrenos, tudumList, series, channels, list, radios, videoteca);
                            showToast(`Importados ${list.length} animados`);
                        } else if (filename.includes('videoteca') || filename.includes('albumes') || filename.includes('albums')) {
                            const parsed = JSON.parse(content);
                            const list = (Array.isArray(parsed) ? parsed : (parsed.videoteca || parsed.albumes || [])).map((v, i) => ({ ...v, id: `vid-${Date.now()}-${i}` }));
                            setVideoteca(list);
                            recordStateChange(movies, estrenos, tudumList, series, channels, animados, radios, list);
                            showToast(`Importados ${list.length} álbumes en BoxPlayMusic`);
                        } else {
                            showToast('Formato de archivo no reconocido', 'error');
                        }
                    } catch (err) {
                        showToast('Error al leer el archivo seleccionado', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // Restauración y guardado local seguro
            useEffect(() => {
                const loadData = async () => {
                    const localMovies = localStorage.getItem('boxplay_admin_movies') || localStorage.getItem('magis_admin_movies');
                    const localEstrenos = localStorage.getItem('boxplay_admin_estrenos') || localStorage.getItem('magis_admin_estrenos');
                    const localTudum = localStorage.getItem('boxplay_admin_tudum') || localStorage.getItem('magis_admin_tudum');
                    const localSeries = localStorage.getItem('boxplay_admin_series') || localStorage.getItem('magis_admin_series');
                    const localTV = localStorage.getItem('boxplay_admin_tv') || localStorage.getItem('magis_admin_tv');
                    const localAnimados = localStorage.getItem('boxplay_admin_animados') || localStorage.getItem('magis_admin_animados');
                    const localRadios = localStorage.getItem('boxplay_admin_radios') || localStorage.getItem('magis_admin_radios');
                    const localVideoteca = localStorage.getItem('boxplay_admin_videoteca') || localStorage.getItem('magis_admin_videoteca');

                    if (localMovies && localEstrenos && localTudum && localSeries && localTV && localAnimados && localVideoteca && localRadios) {
                        try {
                            const m = JSON.parse(localMovies);
                            const est = JSON.parse(localEstrenos);
                            const tud = JSON.parse(localTudum);
                            const s = JSON.parse(localSeries);
                            const t = JSON.parse(localTV);
                            const a = JSON.parse(localAnimados);
                            const r = JSON.parse(localRadios);
                            const v = JSON.parse(localVideoteca);

                            setMovies(m);
                            setEstrenos(est);
                            setTudumList(tud);
                            setSeries(s);
                            setChannels(t);
                            setAnimados(a);
                            setRadios(r);
                            setVideoteca(v);
                            recordStateChange(m, est, tud, s, t, a, r, v);

                            setLoading(false);
                            setDataInitialized(true);
                            showToast("Sesión local restaurada");
                            return;
                        } catch(e) {}
                    }
                    await fetchFromCloud();
                };
                loadData();
            }, []);

            useEffect(() => { 
                if (dataInitialized) {
                    localStorage.setItem('boxplay_admin_movies', JSON.stringify(movies));
                    localStorage.setItem('boxplay_admin_estrenos', JSON.stringify(estrenos));
                    localStorage.setItem('boxplay_admin_tudum', JSON.stringify(tudumList));
                    localStorage.setItem('boxplay_admin_series', JSON.stringify(series));
                    localStorage.setItem('boxplay_admin_tv', JSON.stringify(channels));
                    localStorage.setItem('boxplay_admin_animados', JSON.stringify(animados));
                    localStorage.setItem('boxplay_admin_radios', JSON.stringify(radios));
                    localStorage.setItem('boxplay_admin_videoteca', JSON.stringify(videoteca));
                } 
            }, [movies, estrenos, tudumList, series, channels, animados, radios, videoteca, dataInitialized]);

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-[#0b0f19] text-white">
                        <div className="animate-spin rounded-full h-14 w-14 border-4 border-cyan-500 border-t-transparent mb-5 shadow-[0_0_20px_#06b6d4]"></div>
                        <h2 className="text-base font-extrabold tracking-wide text-slate-200">Sincronizando con Box Play TV...</h2>
                        <p className="text-xs text-slate-500 mt-1">Cargando catálogos remotos y configuración</p>
                    </div>
                );
            }

            const tabs = [
                { id: 'movies', label: 'Películas', icon: 'clapperboard', count: movies.length, color: 'text-blue-500' },
                { id: 'estrenos2026', label: 'Estrenos 2026', icon: 'sparkles', count: estrenos.length, color: 'text-amber-500' },
                { id: 'tudum', label: 'Netflix Tudum', icon: 'flame', count: tudumList.length, color: 'text-rose-500' },
                { id: 'series', label: 'Series', icon: 'film', count: series.length, color: 'text-purple-500' },
                { id: 'animados', label: 'Animados', icon: 'smile', count: animados.length, color: 'text-orange-500' },
                { id: 'videoteca', label: 'BoxPlayMusic', icon: 'disc', count: videoteca.length, color: 'text-yellow-600' },
                { id: 'tv', label: 'TV en Vivo', icon: 'tv', count: channels.length, color: 'text-cyan-500' },
                { id: 'radios', label: 'Radios HD', icon: 'radio', count: radios.length, color: 'text-emerald-500' }
            ];

            return (
                <div className="min-h-screen flex flex-col bg-slate-100 text-slate-900">
                    {toast && <Toast key={toast.id} message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                    
                    <ConfirmModal 
                        isOpen={confirmDialog.isOpen} 
                        message={confirmDialog.message} 
                        onConfirm={confirmDialog.onConfirm} 
                        onCancel={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} 
                    />
                    
                    <GithubSyncModal 
                        isOpen={githubModalOpen} 
                        onClose={() => setGithubModalOpen(false)} 
                        onSync={syncToGithub} 
                    />
                    
                    <PlayerModal 
                        isOpen={playerData.isOpen} 
                        title={playerData.title} 
                        url={playerData.url} 
                        onClose={() => setPlayerData({ isOpen: false, title: '', url: '' })} 
                    />

                    <input type="file" ref={fileInputRef} onChange={handleFileImport} className="hidden" accept=".json,.m3u,.m3u8" />
                    
                    {/* Header Principal */}
                    <header className="bg-slate-950 text-white shadow-2xl sticky top-0 z-40 border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3 text-center md:text-left">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-600 to-teal-500 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)] flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" className="w-5 h-5 fill-white">
                                        <polygon points="40,30 70,50 40,70"/>
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="text-lg font-black tracking-tight flex items-center gap-2">
                                        <span>BOXPLAY<span className="text-cyan-400">TV</span></span>
                                        <span className="text-[10px] uppercase font-bold tracking-widest bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded-full">
                                            Panel Pro
                                        </span>
                                    </h1>
                                    <p className="text-slate-400 text-[10px]">Administrador maestro del ecosistema Box Play TV</p>
                                </div>
                            </div>
                            
                            <div className="flex flex-wrap items-center justify-center gap-2">
                                <button onClick={handleUndo} title="Deshacer última acción" className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5 font-bold transition-all shadow-sm">
                                    <Icon name="undo" size={13} /> <span>Deshacer</span>
                                </button>
                                
                                <button onClick={() => setGithubModalOpen(true)} className="text-xs bg-purple-600 hover:bg-purple-700 text-white px-3.5 py-2 rounded-xl flex items-center gap-1.5 font-bold transition-all shadow-[0_0_15px_rgba(147,51,234,0.3)]">
                                    <Icon name="github" size={14} /> <span>GitHub Sync</span>
                                </button>
                                
                                <button onClick={() => fileInputRef.current.click()} className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5 font-bold transition-all shadow-sm">
                                    <Icon name="upload" size={13} /> <span>Importar</span>
                                </button>
                                
                                <button onClick={downloadAllBackups} className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5 font-bold transition-all shadow-sm" title="Descargar copia de seguridad en JSON">
                                    <Icon name="download" size={13} /> <span>Backup</span>
                                </button>

                                <button onClick={() => requestConfirm('¿Descartar cambios no guardados y re-descargar desde GitHub?', fetchFromCloud)} className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-800 flex items-center gap-1.5 font-bold transition-all shadow-sm" title="Actualizar desde servidores remotos">
                                    <Icon name="refresh" size={13} /> <span>Recargar</span>
                                </button>
                            </div>
                        </div>

                        {/* Barra de Pestañas con Contadores */}
                        <div className="bg-slate-900 border-t border-slate-800/80 px-4 py-2">
                            <div className="max-w-7xl mx-auto flex items-center justify-between gap-2 overflow-x-auto custom-scrollbar">
                                <div className="flex gap-1.5 py-1">
                                    {tabs.map(tab => {
                                        const isActive = activeTab === tab.id;
                                        return (
                                            <button 
                                                key={tab.id} 
                                                onClick={() => setActiveTab(tab.id)}
                                                className={`flex items-center gap-2 px-3.5 py-2 rounded-xl font-bold text-xs transition-all whitespace-nowrap ${isActive ? 'bg-gradient-to-r from-cyan-600 to-teal-500 text-white tab-active-indicator shadow-lg' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}`}
                                            >
                                                <Icon name={tab.icon} size={14} className={isActive ? 'text-white' : tab.color} />
                                                <span>{tab.label}</span>
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-black ${isActive ? 'bg-black/30 text-white' : 'bg-slate-800 text-slate-300'}`}>
                                                    {tab.count}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Contenido Dinámico */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8">
                        <ErrorBoundary>
                            {activeTab === 'movies' && (
                                <MoviesEditor 
                                    movies={movies} 
                                    setMovies={(m) => { setMovies(m); recordStateChange(m, estrenos, tudumList, series, channels, animados, radios, videoteca); }} 
                                    showToast={showToast} 
                                    requestConfirm={requestConfirm} 
                                    onTestPlayer={openTestPlayer} 
                                />
                            )}
                            {activeTab === 'estrenos2026' && (
                                <Estrenos2026Editor 
                                    estrenos={estrenos} 
                                    setEstrenos={(est) => { setEstrenos(est); recordStateChange(movies, est, tudumList, series, channels, animados, radios, videoteca); }} 
                                    showToast={showToast} 
                                    requestConfirm={requestConfirm} 
                                    onTestPlayer={openTestPlayer} 
                                />
                            )}
                            {activeTab === 'tudum' && (
                                <TudumEditor 
                                    tudumList={tudumList} 
                                    setTudumList={(tud) => { setTudumList(tud); recordStateChange(movies, estrenos, tud, series, channels, animados, radios, videoteca); }} 
                                    showToast={showToast} 
                                    requestConfirm={requestConfirm} 
                                    onTestPlayer={openTestPlayer} 
                                />
                            )}
                            {activeTab === 'series' && (
                                <SeriesEditor 
                                    series={series} 
                                    setSeries={(s) => { setSeries(s); recordStateChange(movies, estrenos, tudumList, s, channels, animados, radios, videoteca); }} 
                                    showToast={showToast} 
                                    requestConfirm={requestConfirm} 
                                    onTestPlayer={openTestPlayer} 
                                />
                            )}
                            {activeTab === 'animados' && (
                                <AnimadosEditor 
                                    animados={animados} 
                                    setAnimados={(a) => { setAnimados(a); recordStateChange(movies, estrenos, tudumList, series, channels, a, radios, videoteca); }} 
                                    showToast={showToast} 
                                    requestConfirm={requestConfirm} 
                                    onTestPlayer={openTestPlayer} 
                                />
                            )}
                            {activeTab === 'videoteca' && (
                                <VideotecaEditor 
                                    videoteca={videoteca} 
                                    setVideoteca={(v) => { setVideoteca(v); recordStateChange(movies, estrenos, tudumList, series, channels, animados, radios, v); }} 
                                    showToast={showToast} 
                                    requestConfirm={requestConfirm} 
                                    onTestPlayer={openTestPlayer} 
                                />
                            )}
                            {activeTab === 'tv' && (
                                <TvEditor 
                                    channels={channels} 
                                    setChannels={(c) => { setChannels(c); recordStateChange(movies, estrenos, tudumList, series, c, animados, radios, videoteca); }} 
                                    showToast={showToast} 
                                    requestConfirm={requestConfirm} 
                                    onTestPlayer={openTestPlayer} 
                                />
                            )}
                            {activeTab === 'radios' && (
                                <RadiosEditor 
                                    radios={radios} 
                                    setRadios={(r) => { setRadios(r); recordStateChange(movies, estrenos, tudumList, series, channels, animados, r, videoteca); }} 
                                    showToast={showToast} 
                                    requestConfirm={requestConfirm} 
                                    onTestPlayer={openTestPlayer} 
                                />
                            )}
                        </ErrorBoundary>
                    </main>

                    {/* Footer Informativo */}
                    <footer className="bg-slate-900 border-t border-slate-800 text-slate-400 text-xs py-4 px-4 sm:px-8 text-center mt-auto">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                            <span>Box Play TV Panel de Control Pro • Plataforma Administrativa</span>
                            <span className="font-mono text-[11px] text-cyan-400">Compatible con StreamTube-V20 // v6.5</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
