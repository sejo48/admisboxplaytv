<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Play TV - Panel de Control Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a'
                        },
                        cyber: {
                            cyan: '#06b6d4',
                            teal: '#14b8a6',
                            dark: '#0b0f19',
                            darker: '#030712'
                        }
                    }
                }
            }
        };
    </script>
    
    <!-- React 18 Producción & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        if (typeof Babel !== 'undefined') {
            Babel.registerPreset('react-classic', {
                presets: [
                    [Babel.availablePresets['react'], { runtime: 'classic' }]
                ]
            });
        }
    </script>

    <!-- Tipografía Inter y Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        body { 
            background-color: #f8fafc; 
            color: #0f172a; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { transform: translateY(0); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.25s ease-out; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .font-mono-code { font-family: 'Share Tech Mono', monospace; }
        
        .tab-active-indicator {
            box-shadow: 0 4px 14px 0 rgba(6, 182, 212, 0.35);
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#0b0f19;color:white;flex-direction:column;font-family:sans-serif;">
            <div style="width:40px;height:40px;border:3px solid #06b6d4;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
            <h2 style="font-weight:700;font-size:0.95rem;letter-spacing:0.05em;color:#94a3b8;">Iniciando Box Play TV Panel Pro...</h2>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useRef, useMemo, useCallback, Component } = React;

        const SOURCE_URLS = {
            TV: './listaoficial.m3u',
            SERIES: './playlist.json',
            MOVIES: './peliculas.json',
            ESTRENOS2026: './peliculas2.json',
            ANIMADOS: './animados.json',
            RADIOS: './radios.json',
            VIDEOTECA: './videoteca.json',
            TUDUM: './tudum.json'
        };

        const RAW_URLS = {
            TV: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/listaoficial.m3u',
            SERIES: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/playlist.json',
            MOVIES: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas.json',
            ESTRENOS2026: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/peliculas2.json',
            ANIMADOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/animados.json',
            RADIOS: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/radios.json',
            VIDEOTECA: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/videoteca.json',
            TUDUM: 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/main/tudum.json'
        };

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl m-4 text-xs font-bold space-y-2">
                            <p>⚠️ Ocurrió un error inesperado al renderizar este módulo.</p>
                            <p className="font-mono text-[11px] text-rose-500">{String(this.state.error)}</p>
                            <button onClick={() => this.setState({ hasError: false })} className="px-3 py-1.5 bg-rose-600 text-white rounded-lg hover:bg-rose-700 font-sans">
                                Reintentar
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }
        const convertUrl = (url) => {
            if (!url) return '';
            if (url.includes('ok.ru/video/search') || url.includes('ok.ru/search')) return url;
            if (url.includes('ok.ru/video/')) return url.replace('ok.ru/video/', 'ok.ru/videoembed/');
            if (url.includes('youtube.com') && !url.includes('/embed/')) {
                let videoId = '';
                if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1]?.split('&')[0];
                } else if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1]?.split('?')[0];
                }
                if (videoId) return `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/file/d/')) {
                    const parts = url.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (url.includes('id=')) {
                    const parts = url.split('id=');
                    if (parts[1]) fileId = parts[1].split('&')[0];
                }
                if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            if (url.includes('archive.org/details/') || url.includes('archive.org/download/')) {
                const match = url.match(/archive\.org\/(?:details|download)\/([^\/\?]+)/);
                if (match && match[1]) {
                    return `https://archive.org/embed/${match[1]}`;
                }
            }
            return url;
        };

        const getArchiveIdFromUrl = (url) => {
            if (!url) return null;
            const match = url.match(/archive\.org\/(?:details|download|embed)\/([^\/\?]+)/);
            return match ? match[1] : null;
        };

        const downloadFile = (content, filename, type) => {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        const generateM3U = (channels) => {
            let m3u = '#EXTM3U\n';
            channels.forEach(ch => {
                m3u += `#EXTINF:-1 tvg-name="${ch.title}" tvg-logo="${ch.logo || ''}" group-title="${ch.group || 'General'}",${ch.title}\n`;
                m3u += `${ch.url}\n`;
            });
            return m3u;
        };

        const parseM3U = (data) => {
            if (!data) return [];
            const lines = data.split(/\r?\n/);
            const channels = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const urlLine = lines[i + 1]?.trim();
                    if (urlLine && !urlLine.startsWith('#')) {
                        let title = 'Canal';
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) title = line.substring(commaIndex + 1).trim();
                        const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
                        const logo = logoMatch ? logoMatch[1] : '';
                        const groupMatch = line.match(/group-title="([^"]*)"/i);
                        const group = groupMatch ? groupMatch[1] : 'General';
                        channels.push({ id: `tv-${Date.now()}-${i}`, title, logo, group, url: urlLine });
                    }
                }
            }
            return channels;
        };

        const fetchSmart = async (localUrl, rawUrl, isJson = true) => {
            const cacheBust = `?t=${Date.now()}`;
            try {
                const res = await fetch(localUrl + cacheBust);
                if (res.ok) {
                    const text = await res.text();
                    if (!text.trim().startsWith('<!DOCTYPE html') && !text.trim().startsWith('<html')) {
                        return isJson ? JSON.parse(text) : text;
                    }
                }
            } catch (e) {}

            try {
                const resRaw = await fetch(rawUrl + cacheBust);
                if (resRaw.ok) {
                    return isJson ? await resRaw.json() : await resRaw.text();
                }
            } catch (e) {}

            return isJson ? [] : '';
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            switch (name) {
                case 'tv': return <i className={`fa-solid fa-tv ${className}`} style={{ fontSize: size }}></i>;
                case 'film': return <i className={`fa-solid fa-film ${className}`} style={{ fontSize: size }}></i>;
                case 'clapperboard': return <i className={`fa-solid fa-clapperboard ${className}`} style={{ fontSize: size }}></i>;
                case 'sparkles': return <i className={`fa-solid fa-wand-magic-sparkles ${className}`} style={{ fontSize: size }}></i>;
                case 'plus': return <i className={`fa-solid fa-plus ${className}`} style={{ fontSize: size }}></i>;
                case 'trash': return <i className={`fa-solid fa-trash-can ${className}`} style={{ fontSize: size }}></i>;
                case 'edit': return <i className={`fa-solid fa-pen-to-square ${className}`} style={{ fontSize: size }}></i>;
                case 'download': return <i className={`fa-solid fa-download ${className}`} style={{ fontSize: size }}></i>;
                case 'upload': return <i className={`fa-solid fa-upload ${className}`} style={{ fontSize: size }}></i>;
                case 'x': return <i className={`fa-solid fa-xmark ${className}`} style={{ fontSize: size }}></i>;
                case 'up': return <i className={`fa-solid fa-arrow-up ${className}`} style={{ fontSize: size }}></i>;
                case 'down': return <i className={`fa-solid fa-arrow-down ${className}`} style={{ fontSize: size }}></i>;
                case 'save': return <i className={`fa-solid fa-floppy-disk ${className}`} style={{ fontSize: size }}></i>;
                case 'alert': return <i className={`fa-solid fa-triangle-exclamation ${className}`} style={{ fontSize: size }}></i>;
                case 'refresh': return <i className={`fa-solid fa-rotate ${className}`} style={{ fontSize: size }}></i>;
                case 'smile': return <i className={`fa-solid fa-face-smile ${className}`} style={{ fontSize: size }}></i>;
                case 'radio': return <i className={`fa-solid fa-tower-broadcast ${className}`} style={{ fontSize: size }}></i>;
                case 'disc': return <i className={`fa-solid fa-compact-disc ${className}`} style={{ fontSize: size }}></i>;
                case 'music': return <i className={`fa-solid fa-music ${className}`} style={{ fontSize: size }}></i>;
                case 'play': return <i className={`fa-solid fa-play ${className}`} style={{ fontSize: size }}></i>;
                case 'github': return <i className={`fa-brands fa-github ${className}`} style={{ fontSize: size }}></i>;
                case 'undo': return <i className={`fa-solid fa-rotate-left ${className}`} style={{ fontSize: size }}></i>;
                case 'grip': return <i className={`fa-solid fa-grip-vertical ${className}`} style={{ fontSize: size }}></i>;
                case 'flame': return <i className={`fa-solid fa-fire ${className}`} style={{ fontSize: size }}></i>;
                case 'search': return <i className={`fa-solid fa-magnifying-glass ${className}`} style={{ fontSize: size }}></i>;
                case 'archive': return <i className={`fa-solid fa-box-archive ${className}`} style={{ fontSize: size }}></i>;
                default: return <i className={`fa-solid fa-circle ${className}`} style={{ fontSize: size }}></i>;
            }
        };

        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => { 
                const timer = setTimeout(onClose, 3200); 
                return () => clearTimeout(timer); 
            }, [onClose]);

            const bgStyle = type === 'success' ? 'bg-emerald-600 text-white' : type === 'info' ? 'bg-cyan-600 text-white' : 'bg-rose-600 text-white';
            return (
                <div className={`fixed bottom-5 right-5 ${bgStyle} px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-fade-in z-[400] border border-white/20`}>
                    <Icon name={type === 'success' ? 'save' : 'alert'} size={16} />
                    <span className="font-bold text-xs sm:text-sm tracking-wide">{message}</span>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel, confirmText = "Confirmar", cancelText = "Cancelar" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[500] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full border border-slate-100 space-y-4">
                        <div className="flex items-center gap-3 text-rose-600">
                            <div className="w-10 h-10 rounded-2xl bg-rose-100 flex items-center justify-center flex-shrink-0">
                                <Icon name="alert" size={20} />
                            </div>
                            <h3 className="font-extrabold text-base text-slate-900">Confirmación Requerida</h3>
                        </div>
                        <p className="text-slate-600 text-xs sm:text-sm leading-relaxed">{message}</p>
                        <div className="flex justify-end gap-2.5 pt-2">
                            <button onClick={onCancel} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold transition-colors">
                                {cancelText}
                            </button>
                            <button onClick={() => { onConfirm(); onCancel(); }} className="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-colors shadow-md">
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const PlayerModal = ({ isOpen, title, url, onClose }) => {
            const videoRef = useRef(null);
            const audioRef = useRef(null);
            const hlsRef = useRef(null);
            const [playerError, setPlayerError] = useState(false);

            const converted = useMemo(() => convertUrl(url), [url]);
            const isEmbed = useMemo(() => {
                if (!converted) return false;
                return converted.includes('ok.ru/videoembed') || 
                       converted.includes('youtube.com/embed') || 
                       converted.includes('drive.google.com') || 
                       converted.includes('archive.org/embed');
            }, [converted]);

            const isAudioStream = useMemo(() => {
                if (!url) return false;
                const lower = url.toLowerCase();
                return lower.endsWith('.mp3') || lower.endsWith('.m4a') || lower.endsWith('.aac') || lower.includes('/stream') || lower.includes('icecast') || lower.includes('streamtheworld') || lower.includes('turadio.stream');
            }, [url]);

            useEffect(() => {
                setPlayerError(false);
                if (!isOpen || !url || isEmbed) return;

                if (isAudioStream) {
                    const audio = audioRef.current;
                    if (audio) {
                        audio.src = url;
                        audio.play().catch(() => {});
                    }
                    return;
                }

                const video = videoRef.current;
                if (!video) return;

                if (url.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        if (hlsRef.current) hlsRef.current.destroy();
                        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hlsRef.current = hls;
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.play().catch(() => {});
                        });
                        hls.on(Hls.Events.ERROR, () => {
                            setPlayerError(true);
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                        video.addEventListener('loadedmetadata', () => {
                            video.play().catch(() => {});
                        });
                    }
                } else {
                    video.src = url;
                    video.play().catch(() => {});
                }

                return () => {
                    if (hlsRef.current) {
                        hlsRef.current.destroy();
                        hlsRef.current = null;
                    }
                };
            }, [isOpen, url, isEmbed, isAudioStream]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[550] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col">
                        <div className="px-5 py-3.5 bg-slate-950 flex justify-between items-center border-b border-slate-800">
                            <h3 className="text-white font-extrabold text-xs sm:text-sm truncate flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                                <span>Probando Reproducción: {title}</span>
                            </h3>
                            <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-white rounded-lg transition-colors">
                                <Icon name="x" size={18} />
                            </button>
                        </div>

                        <div className="p-2 sm:p-4 bg-black aspect-video flex items-center justify-center relative overflow-hidden">
                            {isEmbed ? (
                                <iframe 
                                    src={converted} 
                                    className="w-full h-full border-0 rounded-2xl" 
                                    allow="autoplay; encrypted-media; fullscreen" 
                                    allowFullScreen
                                    title={title}
                                ></iframe>
                            ) : isAudioStream ? (
                                <div className="flex flex-col items-center justify-center gap-4 text-center p-6">
                                    <div className="w-16 h-16 rounded-full bg-cyan-500/20 border border-cyan-500/40 text-cyan-400 flex items-center justify-center text-2xl animate-pulse">
                                        <Icon name="music" size={28} />
                                    </div>
                                    <span className="text-white font-bold text-sm">{title}</span>
                                    <audio ref={audioRef} controls className="w-full max-w-md accent-cyan-500"></audio>
                                </div>
                            ) : (
                                <video ref={videoRef} controls className="w-full h-full max-h-[60vh] bg-black rounded-2xl"></video>
                            )}

                            {playerError && (
                                <div className="absolute inset-0 bg-black/80 flex items-center justify-center p-6 text-center">
                                    <div className="text-rose-400 text-xs font-bold space-y-2">
                                        <p>⚠️ No se pudo decodificar el flujo del video.</p>
                                        <p className="text-slate-400 text-[10px]">Verifica si la URL está en línea o requiere cabeceras CORS específicas.</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="p-3 bg-slate-950 text-[11px] text-slate-400 border-t border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-2">
                            <span className="truncate max-w-md font-mono text-cyan-300">URL: {converted || url}</span>
                            <button onClick={onClose} className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-xs transition-colors self-end sm:self-auto">
                                Cerrar Ventana
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const GithubSyncModal = ({ isOpen, onClose, onSync }) => {
            const [token, setToken] = useState(() => localStorage.getItem('boxplay_github_pat') || localStorage.getItem('magis_github_pat') || '');
            const [repo, setRepo] = useState(() => localStorage.getItem('boxplay_github_repo') || localStorage.getItem('magis_github_repo') || 'sejo48/StreamTube-V20');
            const [branch, setBranch] = useState(() => localStorage.getItem('boxplay_github_branch') || 'main');
            const [syncing, setSyncing] = useState(false);
            const [syncStep, setSyncStep] = useState('');

            if (!isOpen) return null;

            const handleSaveAndSync = async (e) => {
                e.preventDefault();
                localStorage.setItem('boxplay_github_pat', token);
                localStorage.setItem('boxplay_github_repo', repo);
                localStorage.setItem('boxplay_github_branch', branch);
                setSyncing(true);
                await onSync(token, repo, branch, setSyncStep);
                setSyncing(false);
                setSyncStep('');
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[500] flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white p-6 sm:p-7 rounded-3xl shadow-2xl max-w-md w-full border border-slate-100 space-y-4">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-cyan-500/10 text-cyan-600 flex items-center justify-center">
                                    <Icon name="github" size={22} />
                                </div>
                                <div>
                                    <h3 className="font-extrabold text-base text-slate-900">Sincronización GitHub API</h3>
                                    <p className="text-[11px] text-slate-500">Actualiza los 8 archivos de Box Play TV en vivo</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-700"><Icon name="x" size={18} /></button>
                        </div>

                        <form onSubmit={handleSaveAndSync} className="space-y-3.5">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Repositorio de Destino (usuario/repo)</label>
                                <input 
                                    type="text" 
                                    value={repo} 
                                    onChange={e => setRepo(e.target.value)} 
                                    required 
                                    className="w-full p-2.5 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-cyan-500 font-mono" 
                                    placeholder="sejo48/StreamTube-V20" 
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Rama (Branch)</label>
                                    <input 
                                        type="text" 
                                        value={branch} 
                                        onChange={e => setBranch(e.target.value)} 
                                        required 
                                        className="w-full p-2.5 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-cyan-500 font-mono" 
                                        placeholder="main" 
                                    />
                                </div>
                                <div className="flex items-end pb-1 text-[10px] text-slate-400">
                                    <span>Rama predeterminada de GitHub Pages.</span>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">GitHub Personal Access Token (PAT)</label>
                                <input 
                                    type="password" 
                                    value={token} 
                                    onChange={e => setToken(e.target.value)} 
                                    required 
                                    className="w-full p-2.5 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-cyan-500 font-mono" 
                                    placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"

        // --- COMPONENTE EDITOR: NETFLIX TUDUM ---
        const TudumEditor = ({ tudumList, setTudumList, showToast, requestConfirm, onTestPlayer }) => {
            const [editingItem, setEditingItem] = useState(null); 
            const [isFetchingMetadata, setIsFetchingMetadata] = useState(false);
            const [modalForm, setModalForm] = useState({
                album: '',
                artist: '',
                year: '1970',
                genre: 'Rock',
                cover: '',
                musicUrl: '',
                description: ''
            });

            useEffect(() => {
                if (editingItem) {
                    setModalForm({
                        album: editingItem.album || editingItem.titulo || editingItem.title || '',
                        artist: editingItem.artist || editingItem.artista || '',
                        year: String(editingItem.year || editingItem.año || '1970'),
                        genre: mapLegacyGenre(editingItem.genre || editingItem.genero || 'Rock'),
                        cover: editingItem.cover || editingItem.imagen || editingItem.image || '',
                        musicUrl: editingItem.musicUrl || editingItem.urlDrive || editingItem.url || '',
                        description: editingItem.description || editingItem.descripcion || ''
                    });
                }
            }, [editingItem]);

            const handleAutoFetchMetadata = async () => {
                const albumQuery = (modalForm.album || '').trim();
                const artistQuery = (modalForm.artist || '').trim();
                const searchCombined = (artistQuery ? `${artistQuery} ${albumQuery}` : albumQuery).trim();

                if (!searchCombined) {
                    showToast('Por favor introduce el nombre del álbum o artista para buscar metadatos');
                    return;
                }

                setIsFetchingMetadata(true);
                showToast('Buscando metadatos en iTunes y Wikipedia...', 'info');

                let updated = { ...modalForm };

                // 1. Consulta a iTunes Search API (CORS abierto, metadatos y portadas de alta fidelidad)
                try {
                    const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(searchCombined)}&entity=album&limit=5`;
                    const res = await fetch(itunesUrl);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.results && data.results.length > 0) {
                            const match = data.results.find(r => 
                                !artistQuery || (r.artistName || '').toLowerCase().includes(artistQuery.toLowerCase())
                            ) || data.results[0];

                            if (match) {
                                if (match.collectionName && (!albumQuery || albumQuery.length < 5)) updated.album = match.collectionName;
                                if (match.artistName) updated.artist = match.artistName;
                                if (match.releaseDate) {
                                    const yr = new Date(match.releaseDate).getFullYear();
                                    if (yr && !isNaN(yr)) updated.year = String(yr);
                                }
                                if (match.primaryGenreName) {
                                    updated.genre = mapLegacyGenre(match.primaryGenreName);
                                }
                                if (match.artworkUrl100) {
                                    updated.cover = match.artworkUrl100.replace(/100x100bb/g, '1000x1000bb');
                                }
                            }
                        }
                    }
                } catch (err) {
                    console.warn('Error al consultar iTunes API:', err);
                }

                // 2. Consulta a Wikipedia para Reseña Histórica / Sinopsis en español
                try {
                    const targetAlbum = updated.album || albumQuery;
                    const targetArtist = updated.artist || artistQuery;
                    let wikiText = '';

                    const queries = [
                        targetAlbum,
                        `${targetAlbum} (álbum)`,
                        `${targetAlbum} (álbum de ${targetArtist})`,
                        `${targetArtist} ${targetAlbum}`
                    ];

                    for (const q of queries) {
                        if (wikiText) break;
                        try {
                            const wikiRes = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
                            if (wikiRes.ok) {
                                const wData = await wikiRes.json();
                                if (wData.extract && !wData.title?.toLowerCase().includes('desambiguación')) {
                                    wikiText = wData.extract;
                                }
                            }
                        } catch (e) {}
                    }

                    if (!wikiText) {
                        for (const q of [targetAlbum, `${targetAlbum} (album)`]) {
                            if (wikiText) break;
                            try {
                                const enRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
                                if (enRes.ok) {
                                    const enData = await enRes.json();
                                    if (enData.extract && !enData.title?.toLowerCase().includes('disambiguation')) {
                                        wikiText = enData.extract;
                                    }
                                }
                            } catch (e) {}
                        }
                    }

                    if (wikiText) {
                        updated.description = wikiText;
                    } else if (!updated.description) {
                        updated.description = `Producción discográfica clásica de ${updated.artist || 'artista'}, lanzada originalmente en el año ${updated.year}. Obra cumbre dentro de la categoría ${updated.genre}, conservada en calidad máster para la colección BoxPlayMusic.`;
                    }
                } catch (err) {
                    console.warn('Error al consultar Wikipedia:', err);
                }

                setModalForm(updated);
                setIsFetchingMetadata(false);
                showToast('¡Metadatos y portada HD autocompletados con éxito!');
            };
            const [searchTerm, setSearchTerm] = useState('');

            const handleSave = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const title = formData.get('title').trim();

                const existingIndex = tudumList.findIndex(t => 
                    (t.title || t.titulo || '').toLowerCase() === title.toLowerCase() &&

                if (existingIndex !== -1) {
                    showToast(`El estreno "${title}" ya existe en la lista Tudum.`, 'error');
                    return;

                const newItem = {
                    id: editingItem.id || `tudum-${Date.now()}`,
                    title,
                    titulo: title,
                    releaseDate: formData.get('releaseDate') || 'Próximamente',
                    fechaEstreno: formData.get('releaseDate') || 'Próximamente',
                    genre: formData.get('genre') || 'Estreno',
                    genero: formData.get('genre') || 'Estreno',

                    sinopsis: formData.get('synopsis') || '',
                    image: formData.get('image') || '',
                    imagen: formData.get('image') || '',
                    trailerUrl: formData.get('trailerUrl') || '',
                    urlTrailer: formData.get('trailerUrl') || '',
                    availability: formData.get('availability') || 'Costa Rica (Disponible)',
                    disponibilidad: formData.get('availability') || 'Costa Rica (Disponible)',
                    score: formData.get('score') || '9.0 / 10',
                    puntuacion: formData.get('score') || '9.0 / 10'
                };

                if (editingItem && editingItem.id && !editingItem.isNew) {
                    setTudumList(tudumList.map(t => t.id === editingItem.id ? newItem : t));
                    showToast('Estreno Tudum actualizado');

            const exportData = () => {

                    title: rest.title || rest.titulo,

                };

                showToast('Archivo listaoficial.m3u generado');

                const newChs = [...channels];
                if (direction === 'up' && index > 0) {
                    [newChs[index - 1], newChs[index]] = [newChs[index], newChs[index - 1]];
                } else if (direction === 'down' && index < newChs.length - 1) {
                    [newChs[index + 1], newChs[index]] = [newChs[index], newChs[index + 1]];
                }
                setChannels(newChs);
            };

            const handleDragStart = (e, index) => { setDraggedIndex(index); e.dataTransfer.effectAllowed = 'move'; };
            const handleDragOver = (e, index) => {
                e.preventDefault(); e.dataTransfer.dropEffect = 'move';
                if (draggedIndex === null || draggedIndex === index) return;
                const newChs = [...channels];
                const draggedItem = newChs[draggedIndex];
                newChs.splice(draggedIndex, 1);
                newChs.splice(index, 0, draggedItem);
                setDraggedIndex(index);
                setChannels(newChs);
            };
