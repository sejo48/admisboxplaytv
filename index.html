                                    <input name="codigo" defaultValue={editingItem.codigo || ''} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-amber-500 bg-white" placeholder="PIN" />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-xs font-bold mb-1 text-slate-700">Sinopsis / Descripción</label>
                                    <textarea name="descripcion" defaultValue={editingItem.descripcion || editingItem.sinopsis || ''} rows="3" className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-amber-500 bg-white" placeholder="Reseña del estreno..."></textarea>
                                </div>
                                <div className="md:col-span-2 flex justify-end gap-2.5 pt-2">
                                    <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-xl text-xs font-bold transition-colors">
                                        Cancelar
                                    </button>
                                    <button type="submit" className="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold text-xs shadow-md transition-colors">
                                        Guardar Estreno
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className="max-h-[60vh] overflow-y-auto custom-scrollbar space-y-2.5 pr-1">
                        {filteredEstrenos.map((movie, index) => {
                            const poster = movie.imagen || movie.image;
                            const title = movie.titulo || movie.title;
                            const stream = movie.urlDrive || movie.urlOkRu;

                            return (
                                <div key={movie.id || index} className="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl hover:bg-slate-100/90 transition-all">
                                    <div className="flex items-center gap-3.5 min-w-0">
                                        <div className="w-12 h-16 rounded-xl bg-black overflow-hidden border border-slate-200 flex-shrink-0 shadow-sm relative">
                                            <img src={poster} alt="" className="w-full h-full object-cover" onError={(e) => { e.target.src='https://placehold.co/100x150/111/fff?text=IMG'; }} />
                                            {movie.qualityTag && <span className="absolute top-1 right-1 bg-amber-600 text-white text-[8px] font-black px-1 rounded">{movie.qualityTag}</span>}
                                        </div>
                                        <div className="min-w-0">
                                            <h4 className="font-extrabold text-slate-900 text-xs sm:text-sm truncate">{title}</h4>
                                            <p className="text-[11px] text-slate-500 line-clamp-1 mt-0.5">{movie.descripcion || 'Sin descripción'}</p>
                                            {movie.codigo && <span className="text-[9px] bg-amber-100 text-amber-800 font-bold px-1.5 py-0.5 rounded font-mono inline-block mt-0.5">PIN: {movie.codigo}</span>}
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 shrink-0">
                                        {stream && (
                                            <button onClick={() => onTestPlayer(title, stream)} className="p-1.5 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-xl flex items-center gap-1 text-[11px] font-bold px-2.5 transition-colors">
                                                <Icon name="play" size={12} /> Probar
                                            </button>
                                        )}
                                        <div className="flex gap-1">
                                            <button onClick={() => moveItem(index, 'up')} disabled={index === 0} className="p-1.5 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="up" size={13}/></button>
                                            <button onClick={() => moveItem(index, 'down')} disabled={index === estrenos.length - 1} className="p-1.5 text-slate-400 hover:text-slate-800 disabled:opacity-20"><Icon name="down" size={13}/></button>
                                        </div>
                                        <button onClick={() => setEditingItem(movie)} className="p-2 text-cyan-600 hover:bg-cyan-50 rounded-xl transition-colors" title="Editar">
                                            <Icon name="edit" size={15} />
                                        </button>
                                        <button onClick={() => requestConfirm(`¿Eliminar "${title}"?`, () => setEstrenos(estrenos.filter(m => m.id !== movie.id)))} className="p-2 text-rose-600 hover:bg-rose-50 rounded-xl transition-colors" title="Eliminar">
                                            <Icon name="trash" size={15} />
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };
        // --- COMPONENTE EDITOR: SERIES ---
        const SeriesEditor = ({ series, setSeries, showToast, requestConfirm, onTestPlayer }) => {
            const [selectedSerieId, setSelectedSerieId] = useState(null);
            const [editingSerie, setEditingSerie] = useState(null); 
            const [editingEpisode, setEditingEpisode] = useState(null); 
            const [searchTerm, setSearchTerm] = useState('');
            const selectedSerie = series.find(s => s.id === selectedSerieId);

            const exportData = () => {
                const exportSeries = series.map(({ id, ...s }) => ({
                    tituloSerie: s.tituloSerie,
                    descripcion: s.descripcion,
                    imagen: s.imagen,
                    codigo: s.codigo || null,
                    qualityTag: s.qualityTag || '',
                    temporadas: (s.temporadas || []).map(t => ({
                        numeroTemporada: t.numeroTemporada,
                        episodios: (t.episodios || []).map(({ id, ...ep }) => ({
                            tituloEpisodio: ep.tituloEpisodio,
                            urlDrive: ep.urlDrive
                        }))
                    }))
                }));
                downloadFile(JSON.stringify(exportSeries, null, 2), 'playlist.json', 'application/json');
                showToast('Archivo playlist.json generado');
            };

            const saveSerieBase = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const tituloSerie = formData.get('tituloSerie').trim();

                const existingIndex = series.findIndex(s => s.tituloSerie.toLowerCase() === tituloSerie.toLowerCase() && (!editingSerie || s.id !== editingSerie.id));
                if (existingIndex !== -1) {
                    showToast(`La serie "${tituloSerie}" ya existe.`, 'error');
                    return;
                }

                const newData = {
                    tituloSerie,
                    descripcion: formData.get('descripcion') || '',
                    imagen: formData.get('imagen') || '',
                    codigo: formData.get('codigo') || null,
                    qualityTag: formData.get('qualityTag') || ''
                };
                
                if (editingSerie.isNew) {
                    const newSerie = { ...newData, id: `serie-${Date.now()}`, temporadas: [] };
                    setSeries([newSerie, ...series]);
                    setSelectedSerieId(newSerie.id);
                    showToast('Serie creada');
                } else {
                    setSeries(series.map(s => s.id === editingSerie.id ? { ...s, ...newData } : s));
                    showToast('Serie actualizada');
                }
                setEditingSerie(null);
            };

            const addSeason = () => {
                if (!selectedSerie) return;
                const newSeasonNum = (selectedSerie.temporadas || []).length + 1;
                const updatedSerie = {
                    ...selectedSerie,
                    temporadas: [...(selectedSerie.temporadas || []), { numeroTemporada: newSeasonNum, episodios: [] }]
                };
                setSeries(series.map(s => s.id === selectedSerie.id ? updatedSerie : s));
                showToast(`Temporada ${newSeasonNum} añadida`);
            };

            const deleteSeason = (sIdx) => {
                requestConfirm(`¿Eliminar la Temporada ${selectedSerie.temporadas[sIdx].numeroTemporada}?`, () => {
                    const updatedSerie = {
                        ...selectedSerie,
                        temporadas: selectedSerie.temporadas.filter((_, idx) => idx !== sIdx)
                    };
                    setSeries(series.map(s => s.id === selectedSerie.id ? updatedSerie : s));
                    showToast('Temporada eliminada');
                });
            };

            const saveEpisode = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const tituloEpisodio = formData.get('tituloEpisodio').trim();
                const updatedTemporadas = [...selectedSerie.temporadas];
                const season = updatedTemporadas[editingEpisode.seasonIndex];

                const existingEpIndex = season.episodios.findIndex(ep => ep.tituloEpisodio.toLowerCase() === tituloEpisodio.toLowerCase() && (editingEpisode.isNew || season.episodios[editingEpisode.epIndex]?.tituloEpisodio !== tituloEpisodio));
                if (existingEpIndex !== -1) {
                    showToast(`El episodio "${tituloEpisodio}" ya existe en esta temporada.`, 'error');
                    return;
                }

                const epData = { tituloEpisodio, urlDrive: formData.get('urlDrive') || '', id: `ep-${Date.now()}` };
                
                if (editingEpisode.isNew) {
                    season.episodios.push(epData);
                    showToast('Episodio añadido');
                } else {
                    epData.id = season.episodios[editingEpisode.epIndex].id; 
                    season.episodios[editingEpisode.epIndex] = epData;
                    showToast('Episodio actualizado');
                }
                
                setSeries(series.map(s => s.id === selectedSerie.id ? { ...selectedSerie, temporadas: updatedTemporadas } : s));
                setEditingEpisode(null);
            };

            const deleteEpisode = (sIdx, eIdx) => {
                requestConfirm('¿Eliminar este episodio?', () => {
                    const updatedTemporadas = [...selectedSerie.temporadas];
                    updatedTemporadas[sIdx].episodios = updatedTemporadas[sIdx].episodios.filter((_, idx) => idx !== eIdx);
                    setSeries(series.map(s => s.id === selectedSerie.id ? { ...selectedSerie, temporadas: updatedTemporadas } : s));
                    showToast('Episodio eliminado');
                });
            };

            const filteredSeries = series.filter(s => 
                (s.tituloSerie || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (s.descripcion || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 flex flex-col md:flex-row min-h-[72vh] overflow-hidden">
                    {/* Lista Lateral de Series */}
                    <div className="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-slate-200 bg-slate-50 flex flex-col h-[50vh] md:h-auto md:max-h-[82vh]">
                        <div className="p-4 border-b border-slate-200 bg-white flex justify-between items-center">
                            <div>
                                <h2 className="text-base font-black text-slate-900 flex items-center gap-2">
                                    <Icon name="film" className="text-purple-600" size={16} /> Series
                                </h2>
                                <span className="text-[10px] text-slate-500 font-bold">({series.length} series registradas)</span>
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={() => setEditingSerie({ isNew: true })} className="bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1">
                                    <Icon name="plus" size={12} /> Nueva
                                </button>
                                <button onClick={exportData} className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1">
                                    <Icon name="download" size={12} /> Exportar
                                </button>
                            </div>
                        </div>

                        <div className="p-3 bg-white border-b border-slate-200">
                            <input 
                                type="text" 
                                placeholder="Buscar serie..." 
                                value={searchTerm} 
                                onChange={(e) => setSearchTerm(e.target.value)} 
                                className="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none text-xs" 
                            />
                        </div>

                        <div className="overflow-y-auto custom-scrollbar flex-1 p-2 space-y-1.5">
                            {filteredSeries.length === 0 ? (
                                <p className="text-xs text-slate-400 text-center py-6">No se encontraron series</p>
                            ) : (
                                filteredSeries.map(serie => {
                                    const isSelected = selectedSerieId === serie.id;
                                    const totalEps = (serie.temporadas || []).reduce((acc, t) => acc + (t.episodios?.length || 0), 0);

                                    return (
                                        <div 
                                            key={serie.id} 
                                            onClick={() => setSelectedSerieId(serie.id)} 
                                            className={`p-2.5 rounded-2xl cursor-pointer flex items-center gap-3 transition-all ${isSelected ? 'bg-purple-100/80 border-l-4 border-purple-600 shadow-sm' : 'hover:bg-slate-200/60'}`}
                                        >
                                            <div className="w-10 h-14 rounded-lg bg-black overflow-hidden border border-slate-200 flex-shrink-0 shadow-sm">
                                                <img src={serie.imagen} className="w-full h-full object-cover" onError={(e) => { e.target.src='https://placehold.co/40x60/111/fff?text=S'; }} />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h4 className="font-extrabold text-xs truncate text-slate-900">{serie.tituloSerie}</h4>
                                                <p className="text-[10px] text-purple-700 font-bold mt-0.5">{serie.temporadas?.length || 0} Temps · {totalEps} Capítulos</p>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    {/* Detalle de Temporadas y Episodios */}
                    <div className="w-full md:w-2/3 p-4 md:p-6 overflow-y-auto max-h-[70vh] md:max-h-[82vh] custom-scrollbar bg-white">
                        {!selectedSerie ? (
                            <div className="h-full flex flex-col items-center justify-center text-slate-400 py-16">
                                <Icon name="film" size={48} className="mb-3 opacity-20 text-purple-600"/>
                                <p className="text-sm font-bold text-slate-600">Ninguna serie seleccionada</p>
                                <p className="text-xs text-slate-400 mt-1">Elige una serie de la lista lateral o añade una nueva para gestionar sus capítulos.</p>
                            </div>
                        ) : (
                            <div className="animate-fade-in space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between items-start gap-4 border-b border-slate-100 pb-5">
                                    <div className="flex gap-4 items-start">
                                        <div className="w-20 h-28 rounded-xl overflow-hidden bg-black border border-slate-200 shadow-sm shrink-0">
                                            <img src={selectedSerie.imagen} className="w-full h-full object-cover" onError={(e) => { e.target.src='https://placehold.co/100x150/111/fff?text=S'; }} />
                                        </div>
                                        <div>
                                            <h1 className="text-xl font-black text-slate-900">{selectedSerie.tituloSerie}</h1>
                                            {selectedSerie.codigo && <span className="inline-block mt-1 bg-amber-100 text-amber-800 text-[9px] font-bold px-2 py-0.5 rounded mr-2 font-mono">PIN: {selectedSerie.codigo}</span>}
                                            {selectedSerie.qualityTag && <span className="inline-block mt-1 bg-slate-100 text-slate-700 text-[9px] font-bold px-2 py-0.5 rounded mr-2 uppercase">{selectedSerie.qualityTag}</span>}
                                            <p className="text-xs text-slate-600 mt-1.5 line-clamp-3 leading-relaxed">{selectedSerie.descripcion || 'Sin descripción disponible.'}</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 w-full sm:w-auto justify-end shrink-0">
                                        <button onClick={() => setEditingSerie(selectedSerie)} className="px-3.5 py-1.5 text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-xl text-xs font-bold transition-colors">
                                            Editar Serie
                                        </button>
                                        <button onClick={() => requestConfirm(`¿Borrar la serie "${selectedSerie.tituloSerie}"?`, () => {
                                            setSeries(series.filter(s => s.id !== selectedSerie.id));
                                            setSelectedSerieId(null);
                                        })} className="px-3.5 py-1.5 text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl text-xs font-bold transition-colors">
                                            Borrar
                                        </button>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                                        <span>Temporadas y Capítulos</span>
                                        <span className="text-[11px] font-mono bg-purple-50 text-purple-700 px-2 py-0.5 rounded-full font-bold">
                                            {selectedSerie.temporadas?.length || 0}
                                        </span>
                                    </h3>
                                    <button onClick={addSeason} className="text-xs bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-xl flex items-center gap-1.5 font-bold shadow-sm transition-all">
                                        <Icon name="plus" size={12} /> Añadir Temporada
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {(selectedSerie.temporadas || []).length === 0 ? (
                                        <p className="text-xs text-slate-400 py-6 text-center">No hay temporadas creadas. Haz clic en "Añadir Temporada" para comenzar.</p>
                                    ) : (
                                        (selectedSerie.temporadas || []).map((season, sIdx) => (
                                            <div key={sIdx} className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm bg-white">
                                                <div className="bg-slate-50 px-4 py-2.5 flex justify-between items-center border-b border-slate-200">
                                                    <h4 className="font-extrabold text-xs text-slate-800">
                                                        Temporada {season.numeroTemporada} <span className="text-[10px] text-slate-400 font-normal">({season.episodios?.length || 0} episodios)</span>
                                                    </h4>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => setEditingEpisode({ seasonIndex: sIdx, isNew: true })} className="text-[11px] bg-purple-100 text-purple-700 px-2.5 py-1 rounded-lg font-bold hover:bg-purple-200 transition-colors">
                                                            + Añadir Episodio
                                                        </button>
                                                        <button onClick={() => deleteSeason(sIdx)} className="text-[11px] text-rose-600 hover:text-rose-800 px-1 font-bold">
                                                            Eliminar Temp.
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="p-2 space-y-1.5">
                                                    {(season.episodios || []).length === 0 ? (
                                                        <p className="text-[11px] text-slate-400 p-3 text-center">Sin episodios en esta temporada.</p>
                                                    ) : (
                                                        season.episodios.map((ep, eIdx) => (
                                                            <div key={ep.id || eIdx} className="flex items-center justify-between p-2.5 hover:bg-slate-50 rounded-xl text-xs transition-colors">
                                                                <div className="min-w-0 pr-3">
                                                                    <p className="font-bold text-slate-900 truncate flex items-center gap-2">
                                                                        <span className="text-purple-600 font-mono w-5">{eIdx + 1}.</span>
                                                                        <span>{ep.tituloEpisodio}</span>
                                                                    </p>
                                                                    <p className="text-[10px] text-slate-400 font-mono truncate pl-7 mt-0.5">{ep.urlDrive}</p>
                                                                </div>
                                                                <div className="flex gap-2 shrink-0 items-center">
                                                                    {ep.urlDrive && (
                                                                        <button onClick={() => onTestPlayer(ep.tituloEpisodio, ep.urlDrive)} className="p-1 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-lg text-[10px] font-bold px-2 flex items-center gap-1 transition-colors">
                                                                            <Icon name="play" size={11} /> Probar
                                                                        </button>
                                                                    )}
                                                                    <button onClick={() => setEditingEpisode({ seasonIndex: sIdx, epIndex: eIdx, epData: ep, isNew: false })} className="p-1.5 text-cyan-600 hover:bg-cyan-50 rounded-lg" title="Editar">
                                                                        <Icon name="edit" size={13} />
                                                                    </button>
                                                                    <button onClick={() => deleteEpisode(sIdx, eIdx)} className="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg" title="Eliminar">
                                                                        <Icon name="trash" size={13} />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modal Crear/Editar Serie Base */}
                    {editingSerie && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white p-6 sm:p-7 rounded-3xl shadow-2xl border border-slate-100 w-full max-w-md space-y-4">
                                <h3 className="font-extrabold text-base text-slate-900">{editingSerie.isNew ? 'Nueva Serie' : 'Editar Información de la Serie'}</h3>
                                <form onSubmit={saveSerieBase} className="space-y-3.5">
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">Título de la Serie</label>
                                        <input name="tituloSerie" defaultValue={editingSerie.tituloSerie || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ej: Breaking Bad" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">URL de Portada</label>
                                        <input name="imagen" defaultValue={editingSerie.imagen || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-purple-500 font-mono" placeholder="https://..." />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold mb-1 text-slate-700">Calidad</label>
                                            <input name="qualityTag" defaultValue={editingSerie.qualityTag || ''} placeholder="HD" className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-purple-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold mb-1 text-slate-700">PIN (Opcional)</label>
                                            <input name="codigo" defaultValue={editingSerie.codigo || ''} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-purple-500" placeholder="1234"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">Descripción</label>
                                        <textarea name="descripcion" defaultValue={editingSerie.descripcion || ''} rows="3" className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-purple-500" placeholder="Sinopsis de la serie..."></textarea>
                                    </div>
                                    <div className="flex justify-end gap-2.5 pt-3 border-t border-slate-100">
                                        <button type="button" onClick={() => setEditingSerie(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold">Cancelar</button>
                                        <button type="submit" className="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold text-xs shadow-md">Guardar Serie</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Crear/Editar Episodio */}
                    {editingEpisode && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white p-6 rounded-3xl shadow-2xl border border-slate-100 w-full max-w-sm space-y-4">
                                <h3 className="font-extrabold text-base text-slate-900">{editingEpisode.isNew ? 'Añadir Episodio' : 'Editar Episodio'}</h3>
                                <form onSubmit={saveEpisode} className="space-y-3.5">
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">Título del Episodio</label>
                                        <input name="tituloEpisodio" defaultValue={editingEpisode.epData?.tituloEpisodio || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-purple-500" placeholder="Episodio 1" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">URL del Video (Google Drive / OK.ru / Directo)</label>
                                        <input name="urlDrive" defaultValue={editingEpisode.epData?.urlDrive || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-purple-500 font-mono" placeholder="https://..." />
                                    </div>
                                    <div className="flex justify-end gap-2.5 pt-3 border-t border-slate-100">
                                        <button type="button" onClick={() => setEditingEpisode(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold">Cancelar</button>
                                        <button type="submit" className="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold text-xs shadow-md">Guardar Episodio</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- COMPONENTE EDITOR: ANIMADOS ---
        const AnimadosEditor = ({ animados, setAnimados, showToast, requestConfirm, onTestPlayer }) => {
            const [selectedItemId, setSelectedItemId] = useState(null);
            const [editingItem, setEditingItem] = useState(null); 
            const [editingEpisode, setEditingEpisode] = useState(null); 
            const [searchTerm, setSearchTerm] = useState('');
            const selectedItem = animados.find(s => s.id === selectedItemId);

            const exportData = () => {
                const exportArray = animados.map(({ id, ...s }) => {
                    const out = {
                        titulo: s.titulo || s.tituloSerie,
                        descripcion: s.descripcion || '',
                        imagen: s.imagen || '',
                        codigo: s.codigo || null,
                        qualityTag: s.qualityTag || ''
                    };
                    if (s.urlDrive) out.urlDrive = s.urlDrive;
                    if (s.temporadas && s.temporadas.length > 0) {
                        out.temporadas = s.temporadas.map(t => ({
                            numeroTemporada: t.numeroTemporada,
                            episodios: (t.episodios || []).map(({ id, ...ep }) => ({
                                tituloEpisodio: ep.tituloEpisodio,
                                urlDrive: ep.urlDrive
                            }))
                        }));
                    }
                    return out;
                });
                downloadFile(JSON.stringify(exportArray, null, 2), 'animados.json', 'application/json');
                showToast('Archivo animados.json generado');
            };

            const saveItemBase = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const titulo = formData.get('titulo').trim();

                const existingIndex = animados.findIndex(a => (a.titulo || a.tituloSerie || '').toLowerCase() === titulo.toLowerCase() && (!editingItem || a.id !== editingItem.id));
                if (existingIndex !== -1) {
                    showToast(`El animado "${titulo}" ya existe.`, 'error');
                    return;
                }

                const newData = {
                    titulo,
                    tituloSerie: titulo,
                    descripcion: formData.get('descripcion') || '',
                    imagen: formData.get('imagen') || '',
                    urlDrive: formData.get('urlDrive') || '',
                    codigo: formData.get('codigo') || null,
                    qualityTag: formData.get('qualityTag') || ''
                };
                
                if (editingItem.isNew) {
                    const newItem = { ...newData, id: `anim-${Date.now()}`, temporadas: [] };
                    setAnimados([newItem, ...animados]);
                    setSelectedItemId(newItem.id);
                    showToast('Animado creado');
                } else {
                    setAnimados(animados.map(s => s.id === editingItem.id ? { ...s, ...newData } : s));
                    showToast('Animado actualizado');
                }
                setEditingItem(null);
            };

            const addSeason = () => {
                if (!selectedItem) return;
                const newSeasonNum = (selectedItem.temporadas || []).length + 1;
                const updatedItem = {
                    ...selectedItem,
                    temporadas: [...(selectedItem.temporadas || []), { numeroTemporada: newSeasonNum, episodios: [] }]
                };
                setAnimados(animados.map(s => s.id === selectedItem.id ? updatedItem : s));
                showToast(`Temporada ${newSeasonNum} añadida`);
            };

            const deleteSeason = (sIdx) => {
                requestConfirm(`¿Eliminar la Temporada ${selectedItem.temporadas[sIdx].numeroTemporada}?`, () => {
                    const updatedItem = {
                        ...selectedItem,
                        temporadas: selectedItem.temporadas.filter((_, idx) => idx !== sIdx)
                    };
                    setAnimados(animados.map(s => s.id === selectedItem.id ? updatedItem : s));
                    showToast('Temporada eliminada');
                });
            };

            const saveEpisode = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const tituloEpisodio = formData.get('tituloEpisodio').trim();
                const updatedTemporadas = [...(selectedItem.temporadas || [])];
                const season = updatedTemporadas[editingEpisode.seasonIndex];

                const existingEpIndex = season.episodios.findIndex(ep => ep.tituloEpisodio.toLowerCase() === tituloEpisodio.toLowerCase() && (editingEpisode.isNew || season.episodios[editingEpisode.epIndex]?.tituloEpisodio !== tituloEpisodio));
                if (existingEpIndex !== -1) {
                    showToast(`El episodio "${tituloEpisodio}" ya existe en esta temporada.`, 'error');
                    return;
                }

                const epData = { tituloEpisodio, urlDrive: formData.get('urlDrive') || '', id: `ep-${Date.now()}` };
                
                if (editingEpisode.isNew) {
                    season.episodios.push(epData);
                    showToast('Episodio añadido');
                } else {
                    epData.id = season.episodios[editingEpisode.epIndex].id; 
                    season.episodios[editingEpisode.epIndex] = epData;
                    showToast('Episodio actualizado');
                }
                
                setAnimados(animados.map(s => s.id === selectedItem.id ? { ...selectedItem, temporadas: updatedTemporadas } : s));
                setEditingEpisode(null);
            };

            const deleteEpisode = (sIdx, eIdx) => {
                requestConfirm('¿Eliminar este episodio?', () => {
                    const updatedTemporadas = [...selectedItem.temporadas];
                    updatedTemporadas[sIdx].episodios = updatedTemporadas[sIdx].episodios.filter((_, idx) => idx !== eIdx);
                    setAnimados(animados.map(s => s.id === selectedItem.id ? { ...selectedItem, temporadas: updatedTemporadas } : s));
                    showToast('Episodio eliminado');
                });
            };

            const filteredAnimados = animados.filter(a => 
                (a.titulo || a.tituloSerie || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (a.descripcion || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 flex flex-col md:flex-row min-h-[72vh] overflow-hidden">
                    {/* Lista Lateral */}
                    <div className="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-slate-200 bg-slate-50 flex flex-col h-[50vh] md:h-auto md:max-h-[82vh]">
                        <div className="p-4 border-b border-slate-200 bg-white flex justify-between items-center">
                            <div>
                                <h2 className="text-base font-black text-slate-900 flex items-center gap-2">
                                    <Icon name="smile" className="text-orange-500" size={16} /> Animados
                                </h2>
                                <span className="text-[10px] text-slate-500 font-bold">({animados.length} contenidos)</span>
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={() => setEditingItem({ isNew: true })} className="bg-orange-500 hover:bg-orange-600 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1">
                                    <Icon name="plus" size={12} /> Nuevo
                                </button>
                                <button onClick={exportData} className="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1">
                                    <Icon name="download" size={12} /> Exportar
                                </button>
                            </div>
                        </div>

                        <div className="p-3 bg-white border-b border-slate-200">
                            <input 
                                type="text" 
                                placeholder="Buscar animados..." 
                                value={searchTerm} 
                                onChange={(e) => setSearchTerm(e.target.value)} 
                                className="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-500 outline-none text-xs" 
                            />
                        </div>

                        <div className="overflow-y-auto custom-scrollbar flex-1 p-2 space-y-1.5">
                            {filteredAnimados.length === 0 ? (
                                <p className="text-xs text-slate-400 text-center py-6">No hay animados registrados</p>
                            ) : (
                                filteredAnimados.map(item => {
                                    const isSelected = selectedItemId === item.id;
                                    const isSeries = item.temporadas && item.temporadas.length > 0;

                                    return (
                                        <div 
                                            key={item.id} 
                                            onClick={() => setSelectedItemId(item.id)} 
                                            className={`p-2.5 rounded-2xl cursor-pointer flex items-center gap-3 transition-all ${isSelected ? 'bg-orange-100/80 border-l-4 border-orange-500 shadow-sm' : 'hover:bg-slate-200/60'}`}
                                        >
                                            <div className="w-10 h-14 rounded-lg bg-black overflow-hidden border border-slate-200 flex-shrink-0 shadow-sm">
                                                <img src={item.imagen} className="w-full h-full object-cover" onError={(e) => { e.target.src='https://placehold.co/40x60/111/fff?text=A'; }} />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h4 className="font-extrabold text-xs truncate text-slate-900">{item.titulo || item.tituloSerie}</h4>
                                                <p className="text-[10px] text-orange-700 font-bold mt-0.5">
                                                    {isSeries ? `${item.temporadas.length} Temporadas` : 'Película / Episodio Único'}
                                                </p>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    {/* Detalle */}
                    <div className="w-full md:w-2/3 p-4 md:p-6 overflow-y-auto max-h-[70vh] md:max-h-[82vh] custom-scrollbar bg-white">
                        {!selectedItem ? (
                            <div className="h-full flex flex-col items-center justify-center text-slate-400 py-16">
                                <Icon name="smile" size={48} className="mb-3 opacity-20 text-orange-500"/>
                                <p className="text-sm font-bold text-slate-600">Ningún animado seleccionado</p>
                                <p className="text-xs text-slate-400 mt-1">Selecciona una serie animada o película para administrar su contenido.</p>
                            </div>
                        ) : (
                            <div className="animate-fade-in space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between items-start gap-4 border-b border-slate-100 pb-5">
                                    <div className="flex gap-4 items-start">
                                        <div className="w-20 h-28 rounded-xl overflow-hidden bg-black border border-slate-200 shadow-sm shrink-0">
                                            <img src={selectedItem.imagen} className="w-full h-full object-cover" onError={(e) => { e.target.src='https://placehold.co/100x150/111/fff?text=A'; }} />
                                        </div>
                                        <div>
                                            <h1 className="text-xl font-black text-slate-900">{selectedItem.titulo || selectedItem.tituloSerie}</h1>
                                            {selectedItem.codigo && <span className="inline-block mt-1 bg-amber-100 text-amber-800 text-[9px] font-bold px-2 py-0.5 rounded mr-2 font-mono">PIN: {selectedItem.codigo}</span>}
                                            {selectedItem.qualityTag && <span className="inline-block mt-1 bg-slate-100 text-slate-700 text-[9px] font-bold px-2 py-0.5 rounded mr-2 uppercase">{selectedItem.qualityTag}</span>}
                                            <p className="text-xs text-slate-600 mt-1.5 line-clamp-3 leading-relaxed">{selectedItem.descripcion || 'Sin descripción disponible.'}</p>
                                            {selectedItem.urlDrive && (
                                                <div className="mt-2 flex items-center gap-2">
                                                    <span className="text-[11px] font-mono text-cyan-700 font-bold">Enlace directo:</span>
                                                    <button onClick={() => onTestPlayer(selectedItem.titulo, selectedItem.urlDrive)} className="p-1 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-lg text-[10px] font-bold px-2 flex items-center gap-1">
                                                        <Icon name="play" size={11} /> Probar Video
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex gap-2 w-full sm:w-auto justify-end shrink-0">
                                        <button onClick={() => setEditingItem(selectedItem)} className="px-3.5 py-1.5 text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-xl text-xs font-bold transition-colors">
                                            Editar Info
                                        </button>
                                        <button onClick={() => requestConfirm(`¿Borrar "${selectedItem.titulo || selectedItem.tituloSerie}"?`, () => {
                                            setAnimados(animados.filter(s => s.id !== selectedItem.id));
                                            setSelectedItemId(null);
                                        })} className="px-3.5 py-1.5 text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl text-xs font-bold transition-colors">
                                            Borrar
                                        </button>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                                        <span>Temporadas (Si es serie animada)</span>
                                        <span className="text-[11px] font-mono bg-orange-50 text-orange-700 px-2 py-0.5 rounded-full font-bold">
                                            {selectedItem.temporadas?.length || 0}
                                        </span>
                                    </h3>
                                    <button onClick={addSeason} className="text-xs bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-xl flex items-center gap-1.5 font-bold shadow-sm transition-all">
                                        <Icon name="plus" size={12} /> Añadir Temporada
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {(selectedItem.temporadas || []).length === 0 ? (
                                        <div className="p-5 border border-dashed border-slate-300 rounded-2xl text-center text-xs text-slate-500">
                                            Este animado está configurado como película individual o video único. Si deseas convertirlo en serie por episodios, haz clic en "Añadir Temporada" arriba.
                                        </div>
                                    ) : (
                                        (selectedItem.temporadas || []).map((season, sIdx) => (
                                            <div key={sIdx} className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm bg-white">
                                                <div className="bg-slate-50 px-4 py-2.5 flex justify-between items-center border-b border-slate-200">
                                                    <h4 className="font-extrabold text-xs text-slate-800">
                                                        Temporada {season.numeroTemporada} <span className="text-[10px] text-slate-400 font-normal">({season.episodios?.length || 0} episodios)</span>
                                                    </h4>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => setEditingEpisode({ seasonIndex: sIdx, isNew: true })} className="text-[11px] bg-orange-100 text-orange-700 px-2.5 py-1 rounded-lg font-bold hover:bg-orange-200 transition-colors">
                                                            + Añadir Episodio
                                                        </button>
                                                        <button onClick={() => deleteSeason(sIdx)} className="text-[11px] text-rose-600 hover:text-rose-800 px-1 font-bold">
                                                            Eliminar Temp.
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="p-2 space-y-1.5">
                                                    {(season.episodios || []).length === 0 ? (
                                                        <p className="text-[11px] text-slate-400 p-3 text-center">Sin episodios en esta temporada.</p>
                                                    ) : (
                                                        season.episodios.map((ep, eIdx) => (
                                                            <div key={ep.id || eIdx} className="flex items-center justify-between p-2.5 hover:bg-slate-50 rounded-xl text-xs transition-colors">
                                                                <div className="min-w-0 pr-3">
                                                                    <p className="font-bold text-slate-900 truncate flex items-center gap-2">
                                                                        <span className="text-orange-600 font-mono w-5">{eIdx + 1}.</span>
                                                                        <span>{ep.tituloEpisodio}</span>
                                                                    </p>
                                                                    <p className="text-[10px] text-slate-400 font-mono truncate pl-7 mt-0.5">{ep.urlDrive}</p>
                                                                </div>
                                                                <div className="flex gap-2 shrink-0 items-center">
                                                                    {ep.urlDrive && (
                                                                        <button onClick={() => onTestPlayer(ep.tituloEpisodio, ep.urlDrive)} className="p-1 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-lg text-[10px] font-bold px-2 flex items-center gap-1 transition-colors">
                                                                            <Icon name="play" size={11} /> Probar
                                                                        </button>
                                                                    )}
                                                                    <button onClick={() => setEditingEpisode({ seasonIndex: sIdx, epIndex: eIdx, epData: ep, isNew: false })} className="p-1.5 text-cyan-600 hover:bg-cyan-50 rounded-lg" title="Editar">
                                                                        <Icon name="edit" size={13} />
                                                                    </button>
                                                                    <button onClick={() => deleteEpisode(sIdx, eIdx)} className="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg" title="Eliminar">
                                                                        <Icon name="trash" size={13} />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modal Crear/Editar Animado Base */}
                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white p-6 sm:p-7 rounded-3xl shadow-2xl border border-slate-100 w-full max-w-md space-y-4">
                                <h3 className="font-extrabold text-base text-slate-900">{editingItem.isNew ? 'Nuevo Animado' : 'Editar Información del Animado'}</h3>
                                <form onSubmit={saveItemBase} className="space-y-3.5">
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">Título</label>
                                        <input name="titulo" defaultValue={editingItem.titulo || editingItem.tituloSerie || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-orange-500" placeholder="Ej: Los Simpson" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">URL de Portada</label>
                                        <input name="imagen" defaultValue={editingItem.imagen || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-orange-500 font-mono" placeholder="https://..." />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">URL del Video (Opcional si es película)</label>
                                        <input name="urlDrive" defaultValue={editingItem.urlDrive || ''} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-orange-500 font-mono" placeholder="https://drive.google.com/file/d/..." />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold mb-1 text-slate-700">Calidad</label>
                                            <input name="qualityTag" defaultValue={editingItem.qualityTag || ''} placeholder="HD" className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-orange-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold mb-1 text-slate-700">PIN (Opcional)</label>
                                            <input name="codigo" defaultValue={editingItem.codigo || ''} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-orange-500" placeholder="1234"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">Descripción</label>
                                        <textarea name="descripcion" defaultValue={editingItem.descripcion || ''} rows="3" className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-orange-500" placeholder="Sinopsis..."></textarea>
                                    </div>
                                    <div className="flex justify-end gap-2.5 pt-3 border-t border-slate-100">
                                        <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold">Cancelar</button>
                                        <button type="submit" className="px-5 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-bold text-xs shadow-md">Guardar Animado</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Crear/Editar Episodio Animado */}
                    {editingEpisode && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white p-6 rounded-3xl shadow-2xl border border-slate-100 w-full max-w-sm space-y-4">
                                <h3 className="font-extrabold text-base text-slate-900">{editingEpisode.isNew ? 'Añadir Episodio Animado' : 'Editar Episodio'}</h3>
                                <form onSubmit={saveEpisode} className="space-y-3.5">
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">Título del Episodio</label>
                                        <input name="tituloEpisodio" defaultValue={editingEpisode.epData?.tituloEpisodio || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-orange-500" placeholder="Episodio 1" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-slate-700">URL del Video</label>
                                        <input name="urlDrive" defaultValue={editingEpisode.epData?.urlDrive || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-orange-500 font-mono" placeholder="https://..." />
                                    </div>
                                    <div className="flex justify-end gap-2.5 pt-3 border-t border-slate-100">
                                        <button type="button" onClick={() => setEditingEpisode(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold">Cancelar</button>
                                        <button type="submit" className="px-5 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-bold text-xs shadow-md">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- COMPONENTE EDITOR: RADIOS (CYBER RADIO PRO) ---
        const RadiosEditor = ({ radios, setRadios, showToast, requestConfirm, onTestPlayer }) => {
            const [editingItem, setEditingItem] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            const handleSave = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const title = formData.get('title').trim();

                const existingIndex = radios.findIndex(r => (r.title || r.titulo || '').toLowerCase() === title.toLowerCase() && (!editingItem || r.id !== editingItem.id));
                if (existingIndex !== -1) {
                    showToast(`La emisora "${title}" ya existe en la lista.`, 'error');
                    return;
                }

                const newRadio = {
                    id: editingItem.id || `radio-${Date.now()}`,
                    title,
                    titulo: title,
                    logo: formData.get('logo') || '',
                    imagen: formData.get('logo') || '',
                    group: formData.get('group') || 'Nacionales',
                    categoria: formData.get('group') || 'Nacionales',
                    genre: formData.get('genre') || 'Live Radio',
                    genero: formData.get('genre') || 'Live Radio',
                    url: formData.get('url') || '',
                    stream: formData.get('url') || ''
                };

                if (editingItem && editingItem.id && !editingItem.isNew) {
                    setRadios(radios.map(r => r.id === editingItem.id ? newRadio : r));
                    showToast('Emisora actualizada');
                } else {
                    setRadios([newRadio, ...radios]);
                    showToast('Emisora añadida');
                }
                setEditingItem(null);
            };

            const exportData = () => {
                const exportRadios = radios.map(({ id, ...rest }) => ({
                    title: rest.title || rest.titulo,
                    group: rest.group || rest.categoria || 'Nacionales',
                    genre: rest.genre || rest.genero || 'Radio HD',
                    logo: rest.logo || rest.imagen || '',
                    url: rest.url || rest.stream || ''
                }));
                downloadFile(JSON.stringify(exportRadios, null, 2), 'radios.json', 'application/json');
                showToast('Archivo radios.json generado');
            };

            const moveItem = (index, direction) => {
                const newRads = [...radios];
                if (direction === 'up' && index > 0) {
                    [newRads[index - 1], newRads[index]] = [newRads[index], newRads[index - 1]];
                } else if (direction === 'down' && index < newRads.length - 1) {
                    [newRads[index + 1], newRads[index]] = [newRads[index], newRads[index + 1]];
                }
                setRadios(newRads);
            };

            const filteredRadios = radios.filter(r => 
                (r.title || r.titulo || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (r.group || r.categoria || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (r.genre || r.genero || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-4 md:p-7 animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-100 pb-5">
                        <div>
                            <h2 className="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-2.5">
                                <span className="p-2 bg-emerald-50 text-emerald-600 rounded-xl"><Icon name="radio" size={20} /></span>
                                <span>Cyber Radio Pro Ultra</span>
                                <span className="text-xs font-bold text-slate-400 font-mono bg-slate-100 px-2.5 py-0.5 rounded-full">
                                    {radios.length} emisoras

                        </div>
                        <div className="flex gap-2 w-full md:w-auto">
                            <button onClick={() => setEditingItem({ isNew: true })} className="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm">
                                <Icon name="plus" size={14} /> Nueva Emisora
                            </button>
                            <button onClick={exportData} className="flex-1 md:flex-none bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm">
                                <Icon name="download" size={14} /> Exportar JSON
                            </button>
                        </div>
                    </div>

                    <div className="relative">
                        <input 
                            type="text" 
                            placeholder="Buscar radio por nombre, categoría o género..." 
                            value={searchTerm} 
                            onChange={(e) => setSearchTerm(e.target.value)} 
                            className="w-full p-3.5 border border-slate-200 rounded-2xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-xs sm:text-sm pl-10" 
                        />
                        <div className="absolute left-3.5 top-4 text-slate-400"><Icon name="search" size={14} /></div>
                    </div>

                    {editingItem && (
                        <div className="bg-emerald-50/70 p-5 md:p-6 rounded-2xl border border-emerald-200/80 animate-fade-in space-y-4">
                            <h3 className="font-extrabold text-emerald-950 text-sm sm:text-base flex items-center gap-2">
                                <Icon name="edit" size={16} /> {editingItem.isNew ? 'Añadir Nueva Emisora de Radio' : 'Editar Emisora'}
                            </h3>
                            <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold mb-1 text-slate-700">Nombre de la Emisora</label>
                                    <input name="title" defaultValue={editingItem.title || editingItem.titulo || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white" placeholder="Ej: Teletica Radio 91.5 FM" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold mb-1 text-slate-700">Categoría (Ubicación)</label>
                                    <select name="group" defaultValue={editingItem.group || editingItem.categoria || 'Nacionales'} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                                        <option value="Nacionales">Nacionales (Costa Rica)</option>
                                        <option value="Global">Global (Internacional)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold mb-1 text-slate-700">Género Musical</label>
                                    <input name="genre" defaultValue={editingItem.genre || editingItem.genero || ''} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white" placeholder="Ej: Pop / Baladas / Disco / Rock..." />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold mb-1 text-slate-700">URL del Logo / Imagen</label>
                                    <input name="logo" defaultValue={editingItem.logo || editingItem.imagen || ''} className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white font-mono" placeholder="https://..." />
                                </div>
                                <div className="md:col-span-2">

                                    <input name="url" defaultValue={editingItem.url || editingItem.stream || ''} required className="w-full p-2.5 border border-slate-300 rounded-xl text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white font-mono" placeholder="https://icecast..." />
                                </div>

                                </div>
                            </form>
                        </div>
                    )}

                    <div className="max-h-[60vh] overflow-y-auto custom-scrollbar space-y-2.5 pr-1">
                        {filteredRadios.map((radio, index) => {
                            const logo = radio.logo || radio.imagen;
                            const title = radio.title || radio.titulo;
                            const stream = radio.url || radio.stream;
                            const group = radio.group || radio.categoria || 'Nacionales';
                            const genre = radio.genre || radio.genero;

                            return (
                                <div key={radio.id || index} className="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl hover:bg-slate-100/90 transition-all">
                                    <div className="flex items-center gap-3.5 min-w-0">

                                            )}

                                        <div className="min-w-0">

                                                {group} {genre ? `· ${genre}` : ''}
                                            </p>
                                        </div>
                                    </div>
